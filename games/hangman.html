<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="stats"><span>Word: <b id="wn">1</b>/5</span><span class="hearts" id="lives"></span><span>Score: <b id="score">0</b></span></div>
  <div class="panel">
    <div class="q-label">အဓိပ္ပါယ်ကို ကြည့်ပြီး စာလုံးရှာပါ</div>
    <div class="q-text my" id="meaning"></div>
    <div class="mask" id="mask" aria-live="polite"></div>
    <div class="kb" id="kb"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="btn primary" id="next" hidden>Next →</button>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const topic = getTopic();
const LV = getLevel();
renderBar("Hangman · " + topic.name);
const kbBtns = {};
let list, i, word, guessed, lives, solved, score, done, reveal;

[..."abcdefghijklmnopqrstuvwxyz"].forEach(c => {
  const b = document.createElement("button");
  b.textContent = c; b.onclick = () => guess(c);
  kbBtns[c] = b; $("#kb").appendChild(b);
});
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
});

function play() { list = shuffle(topic.words).slice(0, 5); i = 0; solved = 0; score = 0; load(); }
function load() {
  word = list[i].en.toLowerCase(); guessed = new Set(); lives = LV.lives; done = false; reveal = false;
  $("#fb").textContent = ""; $("#fb").className = "fb"; $("#next").hidden = true;
  render();
}
function render() {
  $("#wn").textContent = i + 1; $("#score").textContent = score;
  $("#meaning").textContent = list[i].my;
  $("#mask").textContent = [...word].map(c => (guessed.has(c) || reveal) ? c : "_").join(" ");
  $("#lives").textContent = "❤️".repeat(lives) + "🖤".repeat(LV.lives - lives);
  for (const c in kbBtns) {
    const b = kbBtns[c], g = guessed.has(c);
    b.disabled = g || done;
    b.className = g ? (word.includes(c) ? "hit" : "miss") : "";
  }
}
function guess(c) {
  if (done || guessed.has(c)) return;
  guessed.add(c);
  if (word.includes(c)) {
    sfx.ok();
    if ([...word].every(ch => guessed.has(ch))) finishWord(true);
  } else {
    sfx.bad(); lives--;
    if (lives === 0) finishWord(false);
  }
  render();
}
function finishWord(win) {
  done = true;
  const w = list[i], fb = $("#fb");
  if (win) { solved++; const p = 10 + lives * 2; score += p; addPoints(p); fb.className = "fb ok"; fb.textContent = "✓ " + w.en + " — " + w.ex; speak(w.en); }
  else { reveal = true; fb.className = "fb no"; fb.textContent = "စာလုံးက " + w.en + " ပါ — " + w.ex; }
  const n = $("#next");
  n.hidden = false; n.textContent = i === list.length - 1 ? "Finish" : "Next →"; n.focus();
}
$("#next").onclick = () => {
  if (i < list.length - 1) { i++; load(); return; }
  showResult({
    title: solved === 5 ? "အရမ်းတော်တယ်! 🎉" : "ပြီးပါပြီ!",
    stars: solved === 5 ? 3 : solved >= 3 ? 2 : 1,
    text: solved + " / 5 လုံး ရှာတွေ့တယ် · " + score + " points",
    onAgain: play
  });
};
play.gameId = "hangman";
play();
</script>
</body>
</html>
