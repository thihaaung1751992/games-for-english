<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Flip Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f9f8;
    --ink: #12302d;
    --muted: #4f6b68;
    --front: #ffffff;
    --back: #0d7f72;
    --back-ink: #ffffff;
    --accent: #0d7f72;
    --good: #2f9e44;
    --warn: #e0803a;
    --line: #cfe5e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Nunito", "Noto Sans Myanmar", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    line-height: 1.6;
  }
  .my { font-family: "Noto Sans Myanmar", "Nunito", sans-serif; line-height: 1.9; }
  header { text-align: center; max-width: 640px; }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.1rem); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 1rem; }

  .progress { width: 100%; max-width: 560px; margin: 20px 0 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .count { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin-top: 6px; }

  .scene { width: 100%; max-width: 560px; perspective: 1400px; margin-top: 12px; }
  .card {
    position: relative;
    width: 100%;
    height: clamp(300px, 52vh, 400px);
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.3,.7,.2,1);
    cursor: pointer;
    border: 0; padding: 0; background: none; font: inherit; color: inherit; text-align: center;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 6px; border-radius: 24px; }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(15,60,55,.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px; gap: 8px;
  }
  .front { background: var(--front); border: 2px solid var(--line); }
  .back { background: var(--back); color: var(--back-ink); transform: rotateY(180deg); }
  .tag { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .back .tag { color: #c8ece7; }
  .word { font-size: clamp(2.6rem, 11vw, 4rem); font-weight: 800; line-height: 1.1; margin: 4px 0; }
  .pos { color: var(--muted); font-size: 1.05rem; }
  .speak {
    margin-top: 10px; border: 2px solid var(--accent); background: #fff; color: var(--accent);
    font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 99px; cursor: pointer; min-height: 44px;
  }
  .hint { position: absolute; bottom: 14px; font-size: .85rem; color: var(--muted); }
  .meaning { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 600; line-height: 1.5; }
  .example { background: rgba(255,255,255,.16); border-radius: 14px; padding: 12px 16px; width: 100%; font-size: 1.05rem; }
  .example small { display: block; margin-top: 4px; color: #dcf4f0; font-size: .95rem; }

  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; width: 100%; max-width: 560px; margin-top: 22px; }
  button.btn {
    font: inherit; font-weight: 700; min-height: 52px; border-radius: 14px; border: 2px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; padding: 8px;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn:disabled { opacity: .4; cursor: default; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rate { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 560px; margin-top: 10px; }
  .rate .know { border-color: var(--good); color: var(--good); }
  .rate .again { border-color: var(--warn); color: var(--warn); }
  .rate .know.on { background: var(--good); color: #fff; }
  .rate .again.on { background: var(--warn); color: #fff; }
  .tools { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .tools .btn { min-height: 44px; font-size: .95rem; padding: 6px 14px; }
  .keys { margin-top: 14px; color: var(--muted); font-size: .85rem; text-align: center; }
  @media (max-width: 600px) { .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>English Flip Cards</h1>
  <p class="my">ကတ်ကို နှိပ်ပြီး အဓိပ္ပါယ်ကြည့်ပါ</p>
</header>

<div class="progress">
  <div class="bar"><div id="bar"></div></div>
  <div class="count"><span id="pos">1 / 12</span><span id="score" class="my"></span></div>
</div>

<div class="scene">
  <button class="card" id="card" aria-label="Flip card">
    <div class="face front">
      <span class="tag">English</span>
      <div class="word" id="word"></div>
      <div class="pos" id="pos2"></div>
      <span class="speak" id="speak" role="button" tabindex="0">🔊 Listen</span>
      <span class="hint my">နှိပ်ပြီး လှည့်ပါ</span>
    </div>
    <div class="face back">
      <span class="tag my">မြန်မာ</span>
      <div class="meaning my" id="meaning"></div>
      <div class="example">
        <span id="ex"></span>
        <small class="my" id="exMy"></small>
      </div>
    </div>
  </button>
</div>

<div class="controls">
  <button class="btn" id="prev">← Back</button>
  <button class="btn primary" id="flip">Flip</button>
  <button class="btn" id="next">Next →</button>
</div>
<div class="rate">
  <button class="btn again my" id="again">ထပ်လေ့ကျင့်မယ်</button>
  <button class="btn know my" id="know">သိပြီ ✓</button>
</div>
<div class="tools">
  <button class="btn" id="shuffle">🔀 Shuffle</button>
  <button class="btn my" id="reset">အစက ပြန်စမယ်</button>
</div>
<p class="keys">Keyboard: Space = flip · ← → = previous / next</p>

<script>
const WORDS = [
  ["apple","noun","/ˈæp.əl/","ပန်းသီး","I eat an apple every day.","ကျွန်တော်/ကျွန်မ နေ့တိုင်း ပန်းသီးစားတယ်။"],
  ["book","noun","/bʊk/","စာအုပ်","This book is very interesting.","ဒီစာအုပ်က အရမ်းစိတ်ဝင်စားဖို့ကောင်းတယ်။"],
  ["teacher","noun","/ˈtiː.tʃər/","ဆရာ / ဆရာမ","My teacher is kind.","ကျွန်တော့်/ကျွန်မရဲ့ ဆရာက ကြင်နာတယ်။"],
  ["friend","noun","/frend/","သူငယ်ချင်း","She is my best friend.","သူမက ကျွန်တော့်/ကျွန်မရဲ့ အချစ်ဆုံးသူငယ်ချင်းပါ။"],
  ["water","noun","/ˈwɔː.tər/","ရေ","Please drink more water.","ရေများများ သောက်ပါ။"],
  ["school","noun","/skuːl/","ကျောင်း","We go to school by bus.","ကျွန်တော်တို့ ကျောင်းကို ဘတ်စ်ကားနဲ့သွားတယ်။"],
  ["house","noun","/haʊs/","အိမ်","Their house is near the park.","သူတို့အိမ်က ပန်းခြံအနီးမှာရှိတယ်။"],
  ["happy","adjective","/ˈhæp.i/","ပျော်ရွှင်သော","The children are happy today.","ကလေးတွေ ဒီနေ့ ပျော်နေတယ်။"],
  ["big","adjective","/bɪɡ/","ကြီးသော","He has a big dog.","သူ့မှာ ခွေးကြီးတစ်ကောင်ရှိတယ်။"],
  ["small","adjective","/smɔːl/","သေးသော","I have a small bag.","ကျွန်တော့်/ကျွန်မမှာ အိတ်သေးသေးလေးတစ်လုံးရှိတယ်။"],
  ["eat","verb","/iːt/","စားသည်","We eat lunch at noon.","ကျွန်တော်တို့ နေ့လည်ခင်း နေ့လည်စာစားတယ်။"],
  ["read","verb","/riːd/","ဖတ်သည်","I read a story before bed.","အိပ်ရာမဝင်ခင် ပုံပြင်ဖတ်တယ်။"]
];

let deck = WORDS.map((w, i) => ({ i, w }));
let idx = 0;
const status = {}; // word -> 'know' | 'again'
const $ = id => document.getElementById(id);
const card = $("card");

function render() {
  const [en, pos, ipa, my, ex, exMy] = deck[idx].w;
  card.classList.remove("flipped");
  $("word").textContent = en;
  $("pos2").textContent = pos + "  " + ipa;
  $("meaning").textContent = my;
  $("ex").textContent = "“" + ex + "”";
  $("exMy").textContent = exMy;
  $("pos").textContent = (idx + 1) + " / " + deck.length;
  $("bar").style.width = ((idx + 1) / deck.length * 100) + "%";
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === deck.length - 1;
  const known = Object.values(status).filter(s => s === "know").length;
  $("score").textContent = "သိပြီ " + known + " / " + deck.length;
  $("know").classList.toggle("on", status[en] === "know");
  $("again").classList.toggle("on", status[en] === "again");
}
const flip = () => card.classList.toggle("flipped");
const go = d => { const n = idx + d; if (n >= 0 && n < deck.length) { idx = n; render(); } };

function speak(e) {
  e.stopPropagation();
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(deck[idx].w[0]);
  u.lang = "en-US"; u.rate = 0.85;
  speechSynthesis.speak(u);
}

card.addEventListener("click", flip);
$("speak").addEventListener("click", speak);
$("speak").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(e); } });
$("flip").onclick = flip;
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("know").onclick = () => { status[deck[idx].w[0]] = "know"; if (idx < deck.length - 1) go(1); else render(); };
$("again").onclick = () => { status[deck[idx].w[0]] = "again"; if (idx < deck.length - 1) go(1); else render(); };
$("shuffle").onclick = () => {
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  idx = 0; render();
};
$("reset").onclick = () => { deck = WORDS.map((w, i) => ({ i, w })); for (const k in status) delete status[k]; idx = 0; render(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " && document.activeElement !== card) { e.preventDefault(); flip(); }
});
render();
</script>
</body>
</html>
