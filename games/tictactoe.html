<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Tic-Tac-Toe</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root { --bg: #0a0d1c; --card: #151a33; --ink: #f1f5ff; --muted: #9aa8c7; --line: #2b3558; --accent: #2dd4bf; --good: #34d399; --bad: #fb7185; --star: #fbbf24; --x: #2dd4bf; --o: #fb7185; }
body {
  background: radial-gradient(600px 400px at 15% 0%, rgba(45,212,191,.2), transparent 60%), radial-gradient(600px 400px at 90% 100%, rgba(251,113,133,.2), transparent 60%), var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 480px; }
.score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; margin-bottom: 14px; }
.side { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; background: rgba(255,255,255,.05); border: 2px solid rgba(255,255,255,.1); transition: all .3s; }
.side.o { flex-direction: row-reverse; text-align: right; }
.side.on.x { border-color: var(--x); box-shadow: 0 0 22px rgba(45,212,191,.4); background: rgba(45,212,191,.12); }
.side.on.o { border-color: var(--o); box-shadow: 0 0 22px rgba(251,113,133,.4); background: rgba(251,113,133,.12); }
.side .mk { width: 34px; height: 34px; flex: none; }
.side .mk path, .side .mk circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.side.x .mk path { stroke: var(--x); } .side.o .mk circle { stroke: var(--o); }
.side .nm { font-weight: 800; font-size: .85rem; line-height: 1.2; } .side b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.mid { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 10px; color: var(--muted); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
.mid b { color: var(--ink); font-size: 1.2rem; letter-spacing: 0; }

.boardwrap { position: relative; max-width: 400px; margin: 0 auto; }
.ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px; border-radius: 26px; background: linear-gradient(145deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.cell {
  position: relative; aspect-ratio: 1; border-radius: 18px; border: 0; background: #1a2142; cursor: pointer; padding: 0; transition: background .2s, transform .15s, box-shadow .2s;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.07), 0 4px 0 rgba(0,0,0,.3);
}
.cell:hover:not(:disabled) { background: #232c58; transform: translateY(-3px); }
.cell:active:not(:disabled) { transform: translateY(1px); }
.cell:disabled { cursor: default; }
.cell:not(:disabled):hover::before { content: "?"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: rgba(255,255,255,.22); }
.cell svg { position: absolute; inset: 14%; width: 72%; height: 72%; overflow: visible; }
.cell svg path, .cell svg circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.cell.x svg { filter: drop-shadow(0 0 7px rgba(45,212,191,.8)); } .cell.x path { stroke: var(--x); stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .35s ease-out forwards; }
.cell.x path + path { animation-delay: .22s; }
.cell.o svg { filter: drop-shadow(0 0 7px rgba(251,113,133,.8)); } .cell.o circle { stroke: var(--o); stroke-dasharray: 190; stroke-dashoffset: 190; transform: rotate(-90deg); transform-origin: 50px 50px; animation: draw .5s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell.win { animation: winpulse .9s ease-in-out infinite alternate; }
@keyframes winpulse { to { background: #2b366c; transform: scale(1.05); } }
.cell.dim { opacity: .45; }
.winline { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; z-index: 3; overflow: visible; }
.winline line { stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-dasharray: 400; stroke-dashoffset: 400; filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px currentColor); animation: draw .6s .15s ease-out forwards; }

.msg { text-align: center; font-weight: 800; min-height: 2.8em; margin: 16px 0 6px; padding: 8px 14px; border-radius: 14px; background: rgba(255,255,255,.06); }
.hint { text-align: center; color: var(--muted); font-size: .85rem; }
@media (prefers-reduced-motion: reduce) { .cell.win { animation: none; } .cell.x path, .cell.o circle, .winline line { animation-duration: 1ms; animation-delay: 0s; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app">
  <div class="score">
    <div class="side x on" id="sx"><svg class="mk" viewBox="0 0 100 100"><path d="M18 18 L82 82 M82 18 L18 82"/></svg><div><div class="nm">သင်</div><b id="wx">0</b></div></div>
    <div class="mid"><span>Draw</span><b id="wd">0</b></div>
    <div class="side o" id="so"><svg class="mk" viewBox="0 0 100 100"><circle cx="50" cy="50" r="34"/></svg><div><div class="nm">ကွန်ပျူတာ</div><b id="wo">0</b></div></div>
  </div>
  <div class="boardwrap" id="bw"><div class="ttt" id="board"></div></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <p class="hint">ကွက်တစ်ခုကို နှိပ်ပြီး မေးခွန်းမှန်အောင်ဖြေရင် ✕ ရမယ်။ မှားရင် ကွန်ပျူတာ ○ ကစားမယ်။</p>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script src="js/fx.js"></script>
<script>
const topic = getTopic(), LV = getLevel();
renderBar("Word Tic-Tac-Toe · " + topic.name);
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const SMART = [0.3, 0.6, 0.85, 1][topic.level - 1];
const X_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M18 18 L82 82"/><path d="M82 18 L18 82"/></svg>';
const O_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="33"/></svg>';
const wait = ms => new Promise(r => setTimeout(r, ms));
let cells, busy, over, solved, tally = { x: 0, d: 0, o: 0 };

function play() {
  cells = Array(9).fill(""); busy = false; over = false; solved = 0;
  const bw = $("#bw"); const old = $(".winline", bw); if (old) old.remove();
  const box = $("#board"); box.innerHTML = "";
  cells.forEach((_, n) => {
    const b = document.createElement("button");
    b.className = "cell"; b.setAttribute("aria-label", "Cell " + (n + 1) + ", empty");
    b.onclick = () => mine(n);
    box.appendChild(b);
  });
  turn("x");
}
function turn(w) {
  $("#sx").classList.toggle("on", w === "x"); $("#so").classList.toggle("on", w === "o");
  $("#msg").textContent = w === "x" ? "သင့်အလှည့် — ကွက်တစ်ခု ရွေးပါ" : "🤖 ကွန်ပျူတာ စဉ်းစားနေတယ်…";
}
function paint() {
  [...$("#board").children].forEach((b, n) => {
    const m = cells[n], had = b.dataset.m;
    if (m && had !== m) { b.dataset.m = m; b.innerHTML = m === "x" ? X_SVG : O_SVG; if (m === "x") beep([620], 0.07); else beep([380], 0.08); }
    b.className = "cell" + (m ? " " + m : ""); b.disabled = !!m || over;
    b.setAttribute("aria-label", "Cell " + (n + 1) + (m ? ", " + (m === "x" ? "X" : "O") : ", empty"));
  });
  $("#wx").textContent = tally.x; $("#wd").textContent = tally.d; $("#wo").textContent = tally.o;
}
function winner() {
  for (const l of LINES) if (cells[l[0]] && cells[l[0]] === cells[l[1]] && cells[l[1]] === cells[l[2]]) return l;
  return null;
}
function free() { return cells.map((c, n) => c ? -1 : n).filter(n => n >= 0); }
async function mine(n) {
  if (busy || over || cells[n]) return;
  busy = true;
  const el = $("#board").children[n]; el.style.boxShadow = "0 0 0 3px var(--accent)";
  const ok = await ask(Q.mixed(topic, 1)[0]);
  el.style.boxShadow = "";
  if (ok) { cells[n] = "x"; solved++; addPoints(10); paint(); if (check()) return; }
  else { fx.shake($("#board")); }
  turn("o"); await wait(750);
  cpu(); paint();
  if (check()) return;
  busy = false; turn("x");
}
function find(mark) {
  for (const l of LINES) {
    const v = l.map(i => cells[i]);
    if (v.filter(c => c === mark).length === 2 && v.includes("")) return l[v.indexOf("")];
  }
  return -1;
}
// The computer takes a cell (it wins or blocks more often at higher levels). false if the board is full.
function cpu() {
  const f = free();
  if (!f.length) return false;
  let n = -1;
  if (Math.random() < SMART) n = find("o") >= 0 ? find("o") : find("x");
  if (n < 0 && Math.random() < SMART && !cells[4]) n = 4;
  if (n < 0) n = f[Math.floor(Math.random() * f.length)];
  cells[n] = "o";
  return true;
}
function check() {
  paint();
  const l = winner();
  if (!l && free().length) return false;
  over = true; paint();
  const kids = [...$("#board").children];
  if (l) {
    kids.forEach((b, i) => b.classList.add(l.includes(i) ? "win" : "dim"));
    const pos = i => ({ x: (i % 3) * 100 + 50, y: Math.floor(i / 3) * 100 + 50 });
    // cell centres in a 300x300 box (grid gaps are small enough to ignore)
    const a = pos(l[0]), z = pos(l[2]), w = cells[l[0]];
    $("#bw").insertAdjacentHTML("beforeend", '<svg class="winline" viewBox="0 0 300 300" aria-hidden="true"><line style="color:' + (w === "x" ? "#2dd4bf" : "#fb7185") + '" x1="' + a.x + '" y1="' + a.y + '" x2="' + z.x + '" y2="' + z.y + '"/></svg>');
  }
  const youWon = l && cells[l[0]] === "x";
  if (youWon) tally.x++; else if (l) tally.o++; else tally.d++;
  paint();
  $("#sx").classList.toggle("on", !!youWon); $("#so").classList.toggle("on", !!l && !youWon);
  $("#msg").textContent = youWon ? "သင်နိုင်တယ်! 🎉" : l ? "ကွန်ပျူတာနိုင်တယ်" : "သရေ 🤝";
  if (youWon) { fx.rain(80); sfx.win(); } else if (l) sfx.bad();
  setTimeout(() => showResult({
    title: youWon ? "နိုင်ပါတယ်! 🎉" : l ? "ကွန်ပျူတာ နိုင်သွားတယ် 💪" : "သရေ 🤝",
    stars: youWon ? 3 : l ? 1 : 2,
    text: solved + " ခု မှန်အောင် ဖြေခဲ့တယ်",
    onAgain: play
  }), 1400);
  return true;
}
play.gameId = "tictactoe";
play();
</script>
</body>
</html>
