<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Battle</title>
<link rel="stylesheet" href="css/style.css">
<style>
.mb-arena { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 6px; padding: 16px 10px 12px; border-radius: 20px; border: 2px solid var(--line);
  background: linear-gradient(color-mix(in srgb, var(--accent) 12%, var(--card)), var(--card)); text-align: center; overflow: hidden; }
.mb-side { position: relative; min-width: 0; }
.mb-face { font-size: clamp(3rem, 16vw, 5rem); line-height: 1.1; display: inline-block; }
.mb-face.hurt { animation: shake .35s; } .mb-face.atk { animation: lunge .35s; } .mb-face.dead { opacity: .35; transform: rotate(80deg); }
.mb-name { font-weight: 800; font-size: .95rem; }
.mb-hp { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px auto; max-width: 150px; }
.mb-hp > i { display: block; height: 100%; width: 100%; background: var(--good); transform-origin: left; transition: transform .4s; }
.mb-hp.foe > i { background: var(--bad); }
.mb-vs { font-size: 1.6rem; font-weight: 800; color: var(--muted); padding-bottom: 36px; }
.mb-num { position: absolute; left: 50%; top: 4px; font-weight: 800; font-size: 1.6rem; pointer-events: none; animation: rise 1s forwards; text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.mb-num.dmg { color: var(--bad); } .mb-num.hit { color: var(--star); } .mb-num.heal { color: var(--good); }
.mb-log { text-align: center; min-height: 4.2em; margin: 12px 0 6px; }
.mb-combo { text-align: center; color: var(--warn); font-weight: 800; min-height: 1.8em; }
@keyframes lunge { 50% { transform: translateX(14px) scale(1.1); } }
@keyframes rise { to { transform: translate(-50%, -48px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mb-face.hurt, .mb-face.atk, .mb-num { animation: none; } .mb-num { opacity: .9; } .mb-hp > i { transition: none; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app">
  <div class="stats"><span>Monster: <b id="mn">1</b>/3</span><span>Combo: <b id="streak">0</b> 🔥</span><span>Score: <b id="score">0</b></span></div>
  <div class="mb-arena" id="arena">
    <div class="mb-side"><div class="mb-face" id="hero">🦸</div><div class="mb-name">သင် · <span id="hpn">100</span> HP</div><div class="mb-hp"><i id="hhp"></i></div></div>
    <div class="mb-vs">⚔️</div>
    <div class="mb-side"><div class="mb-face" id="foe">🧟</div><div class="mb-name"><span id="fname"></span> · <span id="fpn"></span> HP</div><div class="mb-hp foe"><i id="fhp"></i></div></div>
  </div>
  <div class="mb-combo" id="combo" aria-live="polite"></div>
  <div class="mb-log" id="log" aria-live="polite"></div>
  <div class="row"><button class="btn primary" id="act">⚔️ တိုက်ခိုက်မယ်!</button></div>
  <p class="muted" style="text-align:center">မေးခွန်းမှန်ရင် သင်တိုက်မယ်၊ မှားရင် ဘီလူးက သင့်ကို တိုက်မယ်။ ဆက်မှန်ရင် ထိုးအားပိုကြီးမယ်။ 🧪 Potion က HP ပြန်ဖြည့်ပေးမယ်။</p>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script>
const topic = getTopic(), LV = getLevel();
renderBar("Monster Battle · " + topic.name);
const HERO_HP = 100, POTION = 35;
const FOE_DMG = [0.7, 1, 1.2, 1.4][topic.level - 1];   // monsters hit harder at higher levels
const MONSTERS = [
  { e: "🧟", n: "Zombie", hp: 30, dmg: 12 },
  { e: "👹", n: "Ogre", hp: 50, dmg: 15 },
  { e: "🐲", n: "Dragon", hp: 70, dmg: 18 }
];
const KINDS = [Q.enMy, Q.myEn, Q.blank, Q.sentence];
let bag = [], hp, mi, foeHp, streak, score, solved, asked, busy, mode;   // mode: fight | potion | over

function nextQ() {
  if (!bag.length) bag = shuffle(topic.words);
  return KINDS[Math.floor(Math.random() * KINDS.length)](topic, bag.pop());
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function say(t) { $("#log").textContent = t; }
function bars() {
  const m = MONSTERS[mi];
  $("#hhp").style.transform = "scaleX(" + Math.max(0, hp) / HERO_HP + ")"; $("#hpn").textContent = Math.max(0, hp);
  $("#fhp").style.transform = "scaleX(" + Math.max(0, foeHp) / m.hp + ")"; $("#fpn").textContent = Math.max(0, foeHp);
  $("#streak").textContent = streak; $("#score").textContent = score; $("#mn").textContent = mi + 1;
  $("#combo").textContent = streak >= 2 ? "🔥 Combo ×" + streak + " — ထိုးအား တိုးနေပြီ!" : "";
}
function float(side, text, cls) {
  const s = document.createElement("span");
  s.className = "mb-num " + cls; s.textContent = text;
  side.appendChild(s); setTimeout(() => s.remove(), 1000);
}
function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 400); }
function spawn() {
  const m = MONSTERS[mi];
  foeHp = m.hp; mode = "fight"; busy = false;
  const f = $("#foe"); f.textContent = m.e; f.classList.remove("dead"); $("#fname").textContent = m.n;
  bars(); say(m.n + " ပေါ်လာပြီ! အဆင်သင့်ဖြစ်ရင် တိုက်ခိုက်ပါ"); $("#act").textContent = "⚔️ တိုက်ခိုက်မယ်!"; $("#act").disabled = false;
}
function play() {
  hp = HERO_HP; mi = 0; streak = 0; score = 0; solved = 0; asked = 0;
  spawn();
}
async function turn() {
  if (busy || mode === "over") return;
  busy = true; $("#act").disabled = true;
  const m = MONSTERS[mi];
  const ok = await ask(nextQ());
  asked++;
  if (ok) {
    solved++; streak++;
    const dmg = Math.min(10 + (streak - 1) * 5, 30);
    anim($("#hero"), "atk"); await wait(150); anim($("#foe"), "hurt");
    foeHp -= dmg; score += dmg; addPoints(dmg); float($("#foe").parentNode, "-" + dmg, "hit");
    bars(); say("💥 သင် " + m.n + " ကို " + dmg + " ထိုးလိုက်တယ်!" + (streak >= 3 ? " (combo!)" : ""));
    await wait(700);
    if (foeHp <= 0) return beaten();
  } else {
    streak = 0;
    const dmg = Math.round(m.dmg * FOE_DMG);
    anim($("#foe"), "atk"); await wait(150); anim($("#hero"), "hurt");
    hp -= dmg; float($("#hero").parentNode, "-" + dmg, "dmg");
    bars(); say("😖 " + m.n + " က သင့်ကို " + dmg + " ထိုးသွားတယ်!");
    await wait(700);
    if (hp <= 0) return lost();
  }
  busy = false; $("#act").disabled = false; $("#act").focus();
}
async function beaten() {
  const f = $("#foe"); f.textContent = "💥"; sfx.win();
  if (mi === MONSTERS.length - 1) { mode = "over"; say("🏆 ဘီလူးအားလုံး အနိုင်ရပြီ!"); await wait(900); return done(true); }
  say("🎉 " + MONSTERS[mi].n + " ရှုံးသွားပြီ! 🧪 Potion တစ်ခု တွေ့တယ်");
  mode = "potion"; busy = false;
  $("#act").textContent = "🧪 Potion သောက်မယ် (+" + POTION + " HP)"; $("#act").disabled = false; $("#act").focus();
}
function drink() {
  const before = hp; hp = Math.min(HERO_HP, hp + POTION);
  float($("#hero").parentNode, "+" + (hp - before), "heal"); sfx.ok();
  mi++; spawn(); say("🧪 HP ပြန်ရပြီ! နောက်ဘီလူး — " + MONSTERS[mi].n + " ပေါ်လာပြီ");
}
function lost() {
  mode = "over"; $("#hero").classList.add("dead"); say("💀 သင် ရှုံးသွားပြီ…");
  setTimeout(() => done(false), 900);
}
function done(win) {
  $("#act").disabled = true;
  const stars = win ? (hp >= 60 ? 3 : hp >= 30 ? 2 : 1) : 1;
  showResult({
    title: win ? "ဘီလူးတွေကို နိုင်ပါပြီ! 🏆" : "ရှုံးသွားပါပြီ 💪",
    stars,
    text: (win ? "HP " + hp + " ကျန်တယ် · " : "ဘီလူး " + (mi) + " ကောင် နိုင်ခဲ့တယ် · ") + solved + " / " + asked + " မှန်တယ်",
    onAgain: again
  });
}
$("#act").onclick = () => { if (mode === "potion") drink(); else turn(); };
function again() { $("#hero").classList.remove("dead"); play(); }
again.gameId = "monster";
play();
</script>
</body>
</html>
