  ["bite off more than you can chew", "chew", "to try to do more than you can manage", "မစွမ်းနိုင်လောက်အောင် များများ ယူလုပ်တယ်", "🍔 စာလုံးအရ: ဝါးမရလောက်အောင် များများကိုက်တာ"],

  ["hit the sack", "sack", "to go to bed", "အိပ်ရာဝင်တယ်", "🛏️ စာလုံးအရ: အိတ်ကို ထိုးတာ (sack = အိပ်ရာ)"],
  ["let sleeping dogs lie", "dogs", "to leave a situation alone so it doesn't cause trouble", "ပြဿနာမဖြစ်အောင် မထိမခိုက်ဘဲ ထားလိုက်တယ်", "🐕 စာလုံးအရ: အိပ်နေတဲ့ ခွေးကို မနှိုးနဲ့"],
  ["the elephant in the room", "elephant", "an obvious problem that nobody wants to talk about", "အားလုံးသိပေမယ့် ဘယ်သူမှ မပြောချင်တဲ့ ပြဿနာ", "🐘 စာလုံးအရ: အခန်းထဲက ဆင်"],
  ["barking up the wrong tree", "tree", "to be wrong about the cause or the person to blame", "အမှားလူ/အမှားအကြောင်းရင်းကို လိုက်နေတယ်", "🐶 စာလုံးအရ: ပင်မှားပေါ်ကို ဟောင်နေတာ"],
  ["cry over spilt milk", "milk", "to be upset about something that cannot be changed", "ပြင်လို့မရတော့တာကို ဝမ်းနည်းနေတယ်", "🥛 စာလုံးအရ: ဖိတ်ကျတဲ့နို့အတွက် ငိုတာ", "fuss"],
  ["go the extra mile", "mile", "to make more effort than people expect", "မျှော်လင့်ထားတာထက် ပိုကြိုးစားတယ်", "🏃 စာလုံးအရ: နောက်ထပ် တစ်မိုင် သွားတာ", "work"],

  ["read between the lines", "lines", "to understand a hidden meaning", "စာကြောင်းတွေကြားက ဝှက်ထားတဲ့ အဓိပ္ပါယ်ကို နားလည်တယ်", "📖 စာလုံးအရ: စာကြောင်းကြားကို ဖတ်တာ"],
  ["a storm in a teacup", "teacup", "a big fuss about something unimportant", "အရေးမကြီးတာကို ကြီးကြီးမားမား ဆူညံနေတယ်", "☕ စာလုံးအရ: လက်ဖက်ရည်ခွက်ထဲက မုန်တိုင်း", "fuss"],
  ["take it with a pinch of salt", "salt", "not to believe something completely", "အပြည့်အဝ မယုံဘဲ သတိထားပြီး နားထောင်တယ်", "🧂 စာလုံးအရ: ဆားတစ်ဆုပ်နဲ့အတူ ယူတာ"],

  ["off the record", "record", "not official and not to be made public", "တရားဝင်မဟုတ်ဘဲ လူသိရှင်ကြား မပြောရဘူး", "🎙️ စာလုံးအရ: မှတ်တမ်းပြင်ပ", "secret"],
  ["keep your fingers crossed", "fingers", "to hope for good luck", "ကံကောင်းပါစေလို့ မျှော်လင့်ပေးတယ်", "🤞 စာလုံးအရ: လက်ချောင်းတွေ ထပ်ထားတာ", "luck"],
  ["bury the hatchet", "hatchet", "to stop arguing and become friends again", "ရန်ကိုဖြေပြီး ပြန်လည်ပေါင်းသင်းတယ်", "🪓 စာလုံးအရ: ပုဆိန်ကို မြှုပ်လိုက်တာ"]
].map(a => ({ i: a[0], k: a[1], m: a[2], my: a[3], lit: a[4], g: a[5] || a[0] }));

// Time to read long meanings: the per-question timer is stretched on this page only.
const LV0 = getLevel();
if (LV0.secs) LV0.secs = Math.max(LV0.secs, 14);

function same(a, b) { return a === b || a.g === b.g; }
function pool(e) { return IDIOMS.filter(x => !same(x, e)); }
function blankIdiom(e) { return e.i.replace(new RegExp("\\b" + e.k + "\\b"), "____"); }
function explain(e) { return e.lit + " — “" + e.i + "” = " + e.m + " (" + e.my + ")"; }

function build() {
  const kinds = shuffle(["meaning", "meaning", "meaning", "meaning", "idiomEn", "idiomMy", "idiomEn", "blank", "blank", "blank"]);
  return take(IDIOMS, 10).map((e, n) => {
    const kind = kinds[n % kinds.length];
    if (kind === "meaning") {
      return mcq({ label: "🔎 ဒီစကားပုံရဲ့ အဓိပ္ပါယ်က ဘာလဲ", text: "“" + e.i + "”", small: true, speak: e.i,
        answer: e.m, pool: pool(e).map(x => x.m), explain: explain(e) });
    }
    if (kind === "idiomEn") {
      return mcq({ label: "🔎 ဘယ်စကားပုံက ဒီအဓိပ္ပါယ်လဲ", text: "= " + e.m, small: true,
        answer: e.i, pool: pool(e).map(x => x.i), explain: explain(e) });
    }
    if (kind === "idiomMy") {
      return mcq({ label: "🔎 ဘယ်စကားပုံက ဒီအဓိပ္ပါယ်လဲ", text: e.my, my: true, small: true,
        answer: e.i, pool: pool(e).map(x => x.i), explain: explain(e) });
    }
    // missing word: the meaning is shown as a clue, so only one idiom fits
    const wrong = IDIOMS.filter(x => !same(x, e) && x.k !== e.k).map(x => x.k)
      .filter(k => !IDIOMS.some(y => y.i === blankIdiom(e).replace("____", k)));
    return mcq({ label: "🔎 ကျန်နေတဲ့ စကားလုံးကို ဖြည့်ပါ", text: blankIdiom(e) + "  (= " + e.m + ")", small: true,
      answer: e.k, pool: wrong, explain: explain(e) });
  });
}

runChoice({ gameId: "idiom", title: "Idiom Detective", build });
</script>
