<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill the Blank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app"></main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script>
runChoice({
  gameId: "fillblank", title: "Fill the Blank",
  build: topic => shuffle(topic.words).map(w => ({
    label: "ဝါကျကို ဖြည့်ပါ", text: blankOut(w), small: true,
    options: shuffle([w, ...others(topic, w, 3)]).map(x => x.en), answer: w.en,
    explain: w.ex + " — " + w.exMy
  }))
});
</script>
</body>
</html>
