<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Scramble</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="stats"><span>Word: <b id="wn">1</b>/<span id="wt">8</span></span><span>Score: <b id="score">0</b></span></div>
  <div class="panel">
    <div class="q-label">ဒီစာလုံးကို ဖွဲ့ပါ</div>
    <div class="q-text my" id="meaning"></div>
    <div class="slots" id="slots" aria-label="Your answer"></div>
    <div class="tiles" id="tiles" aria-label="Letters"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="hint">💡 Hint (−3)</button>
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="skip">Skip</button>
      <button class="btn primary" id="next" hidden>Next →</button>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const topic = getTopic();
if (!getLevel().hint) $("#hint").hidden = true; // no hints at Expert level
renderBar("Word Scramble · " + topic.name);
let list, i, score, solved, hints, letters, placed, locked;

function play() {
  list = shuffle(topic.words); i = 0; score = 0; solved = 0; hints = 0;
  $("#wt").textContent = list.length;
  show();
}
function show() {
  const w = list[i];
  locked = false; placed = [];
  $("#wn").textContent = i + 1; $("#score").textContent = score;
  $("#meaning").textContent = w.my;
  $("#fb").textContent = ""; $("#fb").className = "fb";
  $("#next").hidden = true;
  $("#hint").disabled = false; $("#skip").disabled = false; $("#clear").disabled = false;
  let arr = w.en.split("");
  for (let n = 0; n < 10 && arr.join("") === w.en; n++) arr = shuffle(arr);
  letters = arr.map((ch, id) => ({ ch, id }));
  draw();
}
function draw() {
  const w = list[i].en;
  const slots = $("#slots"), tiles = $("#tiles");
  slots.innerHTML = ""; tiles.innerHTML = "";
  for (let n = 0; n < w.length; n++) {
    const s = document.createElement("button");
    s.className = "slot" + (placed[n] ? " fill" : "");
    s.textContent = placed[n] ? placed[n].ch : "";
    s.setAttribute("aria-label", placed[n] ? "Remove " + placed[n].ch : "Empty slot");
    s.onclick = () => { if (!locked && placed[n]) { placed.splice(n, 1); draw(); } };
    slots.appendChild(s);
  }
  letters.forEach(l => {
    const b = document.createElement("button");
    b.className = "tile";
    b.textContent = l.ch;
    b.disabled = placed.some(p => p.id === l.id);
    b.onclick = () => { if (!locked) { placed.push(l); draw(); if (placed.length === w.length) check(); } };
    tiles.appendChild(b);
  });
}
function check() {
  const w = list[i];
  const ok = placed.map(p => p.ch).join("") === w.en;
  const slots = $("#slots"), fb = $("#fb");
  if (ok) {
    locked = true; solved++;
    score += 10; addPoints(10); sfx.ok(); speak(w.en);
    slots.classList.add("good");
    fb.className = "fb ok"; fb.textContent = "✓ " + w.en + " — " + w.ex;
    $("#hint").disabled = true; $("#skip").disabled = true; $("#clear").disabled = true;
    const n = $("#next");
    n.hidden = false; n.textContent = i === list.length - 1 ? "Finish" : "Next →"; n.focus();
    $("#score").textContent = score;
  } else {
    sfx.bad();
    slots.classList.add("bad");
    fb.className = "fb no"; fb.textContent = "မမှန်သေးပါဘူး၊ ထပ်ကြိုးစားပါ";
    setTimeout(() => { slots.classList.remove("bad"); placed = []; fb.textContent = ""; draw(); }, 700);
    locked = true;
    setTimeout(() => { locked = false; }, 700);
  }
}
$("#hint").onclick = () => {
  const w = list[i];
  hints++; score = Math.max(0, score - 3);
  $("#score").textContent = score;
  const blank = w.ex.replace(new RegExp(w.en, "i"), "____");
  $("#fb").className = "fb"; $("#fb").textContent = "💡 " + blank + " (" + w.en.length + " letters, starts with “" + w.en[0] + "”)";
};
$("#clear").onclick = () => { if (!locked) { placed = []; draw(); } };
$("#skip").onclick = () => { next(); };
$("#next").onclick = () => { next(); };
function next() {
  if (i < list.length - 1) { i++; show(); return; }
  const pct = solved / list.length;
  const stars = pct === 1 && hints <= 2 ? 3 : pct >= 0.7 ? 2 : 1;
  showResult({
    title: "ပြီးပါပြီ! 🎉", stars,
    text: solved + " / " + list.length + " လုံး ဖွဲ့နိုင်တယ် · " + score + " points",
    onAgain: play
  });
}
play.gameId = "scramble";
play();
</script>
</body>
</html>
