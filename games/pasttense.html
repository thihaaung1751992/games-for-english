  ["win", "won", "won", "နိုင်သည်", "Our team ___ the match last Saturday.", "ပြီးခဲ့တဲ့ စနေနေ့က ကျွန်တော်တို့အသင်း ပွဲနိုင်ခဲ့တယ်။"],
  ["teach", "taught", "taught", "သင်သည်", "Mr. Aung ___ us English last year.", "ပြီးခဲ့တဲ့နှစ်က ဆရာအောင်က ကျွန်တော်တို့ကို အင်္ဂလိပ်စာ သင်ပေးခဲ့တယ်။"],
  ["catch", "caught", "caught", "ဖမ်းသည်", "Yesterday he ___ the ball with one hand.", "သူ ဘောလုံးကို လက်တစ်ဖက်နဲ့ ဖမ်းခဲ့တယ်။"],
  ["put", "put", "put", "ထားသည်", "I ___ my bag on the chair five minutes ago.", "ငါးမိနစ်က အိတ်ကို ကုလားထိုင်ပေါ်မှာ ထားခဲ့တယ်။"],
  ["cut", "cut", "cut", "ဖြတ်သည်", "Yesterday she ___ the cake into six pieces.", "သူမ ကိတ်ကို ခြောက်တုံး ဖြတ်ခဲ့တယ်။"]
];
const DBL = ["run", "swim", "sit", "get", "put", "cut", "win", "begin", "forget", "stop", "plan", "shop", "drop"];
const ing = b => DBL.includes(b) ? b + b.slice(-1) + "ing" : /[^e]e$/.test(b) ? b.slice(0, -1) + "ing" : b + "ing";
const ed = b => /e$/.test(b) ? b + "d" : b + "ed";

// believable wrong forms for a verb (all of them are definitely not the past simple)
function wrongs(v) {
  const [b, p, pp, , , , custom] = v;
  if (custom) return custom;
  let c;
  if (pp) {
    c = [ed(b), pp, b, ing(b)];
    if (["go", "buy", "think", "teach", "catch", "bring"].includes(b)) c.push(p + "ed");   // classic slips: wented, boughted
    if (DBL.includes(b)) c.push(b + b.slice(-1) + "ed");
  } else if (/[aeiou]y$/.test(b)) c = [b.slice(0, -1) + "ied", b + "d", b, ing(b)];
  else if (/[^aeiou]y$/.test(b)) c = [b + "ed", b.slice(0, -1) + "ed", b, ing(b)];
  else if (/e$/.test(b)) c = [b + "ed", b.slice(0, -1) + "d", b, ing(b)];
  else if (DBL.includes(b)) c = [b + "ed", b + "d", b, ing(b)];
  else c = [b + "d", b, ing(b), b + "s"];
  return [...new Set(c)].filter(x => x !== p);
}
function rule(v) {
  const [b, p, pp, my] = v;
  let r;
  if (pp) r = "ပုံမှန်မဟုတ်တဲ့ (irregular) ကြိယာ — " + b + " → " + p + (pp !== p ? " → " + pp : "") + " ကို မှတ်ထားပါ";
  else if (/[^aeiou]y$/.test(b)) r = "ဗျည်း + y နဲ့ဆုံးရင် y ကို ied ပြောင်းပါ (" + b + " → " + p + ")";
  else if (/e$/.test(b)) r = "e နဲ့ဆုံးရင် d ပဲ ထည့်ပါ (" + b + " + d)";
  else if (DBL.includes(b)) r = "အသံတိုတိုနဲ့ ဆုံးရင် နောက်ဆုံးအက္ခရာ နှစ်လုံးထပ်ပြီး ed (" + b + " → " + p + ")";
  else r = "ပုံမှန်ကြိယာ — ed ထည့်ပါ (" + b + " + ed)";
  return b + " (" + my + ") → " + p + "။ " + r;
}
function build() {
  return take(shuffle(VERBS), ROUNDS).map((v, n) => {
    const [b, p, , my, s, smy] = v, sentence = s.replace("___", p);
    const sty = Math.random() < 0.6;   // true: fill the sentence, false: "past of eat?"
    const q = sty
      ? { label: "🏴‍☠️ ကွင်းလပ်ကို အတိတ်ကာလ (past simple) နဲ့ ဖြည့်ပါ", text: s.replace("___", "____ (" + b + ")"), small: true, hint: smy, speak: sentence }
      : { label: "🏴‍☠️ '" + b + "' ရဲ့ past simple က ဘာလဲ?", text: b, hint: my, speak: b };
    return Object.assign(mcq({ answer: p, pool: wrongs(v), explain: (sty ? sentence + " — " + smy + "\n" : "") + rule(v) }), q);
  });
}

let qs, i, correct, streak, score, answered, tick, tStart;
function paintShip() {
  $("#ship").style.left = (8 + 76 * (correct / ROUNDS)) + "%";
  $("#gold").textContent = correct;
}
function play() {
  clearInterval(tick);
  qs = build(); i = 0; correct = 0; streak = 0; score = 0;
  $("#qt").textContent = qs.length;
  const t = $("#timer"); t.hidden = !LV.secs;
  paintShip(); show();
}
function show() {
  answered = false;
  const q = qs[i];
  $("#qn").textContent = i + 1; $("#streak").textContent = streak; $("#score").textContent = score;
  $("#qlabel").textContent = q.label;
  const qt = $("#qtext"); qt.textContent = q.text; qt.style.fontSize = q.small ? "clamp(1.3rem, 5.5vw, 1.8rem)" : "";
  $("#qhint").textContent = q.hint;
  $("#say").onclick = () => speak(q.speak);
  const box = $("#opts"); box.innerHTML = "";
  q.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o; b.onclick = () => choose(b, o === q.answer);
    box.appendChild(b);
  });
  $("#fb").textContent = ""; $("#fb").className = "fb"; $("#next").hidden = true;
  clearInterval(tick);
  if (LV.secs) {
    tStart = Date.now(); $("#tbar").style.transform = "scaleX(1)";
    tick = setInterval(() => {
      const left = Math.max(0, 1 - (Date.now() - tStart) / (LV.secs * 1000));
      $("#tbar").style.transform = "scaleX(" + left + ")";
      if (left === 0) choose(null, false);
    }, 100);
  }
}
function choose(btn, ok) {
  if (answered) return;
  answered = true; clearInterval(tick);
  const q = qs[i], fb = $("#fb"), ship = $("#ship");
  [...$("#opts").children].forEach(b => { b.disabled = true; if (b.textContent === q.answer) b.classList.add("right"); });
  fb.innerHTML = "";
  if (ok) {
    correct++; streak++;
    const pts = 10 + Math.min(streak - 1, 5) * 2; score += pts; addPoints(pts); sfx.ok();
    fb.className = "fb ok"; fb.appendChild(document.createTextNode("✓ မှန်ပါတယ်! ⛵ ရတနာကျွန်းနား ပိုနီးလာပြီ +" + pts));
    speak(q.answer);
  } else {
    streak = 0; sfx.bad(); if (btn) btn.classList.add("wrong");
    ship.classList.remove("hit"); void ship.offsetWidth; ship.classList.add("hit");
    fb.className = "fb no"; fb.appendChild(document.createTextNode(btn ? "✗ 💥 မှားပါတယ်။" : "⏱ အချိန်ကုန်သွားပါပြီ။"));
  }
  q.explain.split("\n").forEach(line => { fb.appendChild(document.createElement("br")); fb.appendChild(document.createTextNode(line)); });
  paintShip(); $("#streak").textContent = streak; $("#score").textContent = score;
  const n = $("#next"); n.hidden = false; n.textContent = i === qs.length - 1 ? "Finish" : "Next →"; n.focus();
}
$("#next").onclick = () => {
  if (i < qs.length - 1) { i++; show(); return; }
  const r = correct / qs.length;
  showResult({
    title: r >= 0.9 ? "ရတနာကျွန်းရောက်ပါပြီ! 🏴‍☠️💰" : r >= 0.6 ? "ကောင်းပါတယ်၊ ကျွန်းနားနီးပြီ! ⛵" : "ထပ်ကြိုးစားကြည့်ပါ 💪",
    stars: starsFor(r), text: correct + " / " + qs.length + " မှန်တယ် · " + score + " points", onAgain: play
  });
};
play.gameId = "pasttense";
play();
</script>
