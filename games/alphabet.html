<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alphabet Train</title>
<link rel="stylesheet" href="css/style.css">
<style>
.al-track { position: relative; height: 44px; margin: 2px 4px 14px; }
.al-track .rail { position: absolute; left: 0; right: 0; bottom: 8px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 16px); }
.al-track .stops { position: absolute; left: 14px; right: 14px; bottom: 5px; display: flex; justify-content: space-between; }
.al-track .stops i { width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); }
.al-track .stops i.ok { background: var(--good); border-color: var(--good); }
.al-track .stops i.no { background: var(--bad); border-color: var(--bad); }
.al-engine { position: absolute; bottom: 12px; font-size: 1.9rem; line-height: 1; transform: scaleX(-1); transition: left .7s ease-in-out; }
.al-train { display: flex; align-items: flex-end; justify-content: center; gap: 0; margin: 10px 0 8px; flex-wrap: nowrap; }
.al-train .eng { font-size: 2.6rem; line-height: 1; margin-right: 2px; }
.al-car { position: relative; width: clamp(56px, 17vw, 72px); height: clamp(60px, 18vw, 76px); margin-left: 12px; border-radius: 10px; border: 3px solid var(--accent); background: var(--card); display: flex; align-items: center; justify-content: center; font-size: clamp(1.8rem, 8vw, 2.6rem); font-weight: 900; }
.al-car::before { content: ""; position: absolute; left: -13px; top: 55%; width: 10px; height: 4px; background: var(--muted); }
.al-car::after { content: ""; position: absolute; bottom: -9px; left: 12%; width: 76%; height: 8px; background: radial-gradient(circle at 20% 50%, var(--ink) 0 4px, transparent 4.5px), radial-gradient(circle at 80% 50%, var(--ink) 0 4px, transparent 4.5px); }
.al-car.gap { border-style: dashed; color: var(--warn); border-color: var(--warn); }
.al-car.solved { border-color: var(--good); color: var(--good); animation: alpop .45s; }
.al-car.wide { width: auto; min-width: 90px; padding: 0 14px; font-size: clamp(1.4rem, 7vw, 2rem); }
.al-car .em { font-size: 1.1em; margin-right: 6px; }
.opts.letters { grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); }
.opts.letters .opt { font-size: 2rem; min-height: 64px; }
@keyframes alpop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .al-engine { transition: none; } .al-car.solved { animation: none; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app"></main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script>
const topic = getTopic(), LV = getLevel(), lvl = topic.level;
renderBar("Alphabet Train · " + topic.name);
const N = 10, A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
// simple words for "which word starts with this letter?" (x has no easy word, so x is only used in letter-order questions)
const WORDS = [
  ["apple","🍎","ပန်းသီး"],["ant","🐜","ပုရွက်ဆိတ်"],["ball","⚽","ဘောလုံး"],["bus","🚌","ဘတ်စ်ကား"],["cat","🐱","ကြောင်"],["car","🚗","ကား"],
  ["dog","🐶","ခွေး"],["duck","🦆","ဘဲ"],["egg","🥚","ဥ"],["elephant","🐘","ဆင်"],["fish","🐟","ငါး"],["frog","🐸","ဖား"],
  ["grapes","🍇","စပျစ်သီး"],["guitar","🎸","ဂစ်တာ"],["house","🏠","အိမ်"],["horse","🐴","မြင်း"],["ice","🧊","ရေခဲ"],
  ["juice","🧃","ဖျော်ရည်"],["jacket","🧥","ဂျာကင်"],["key","🔑","သော့"],["kite","🪁","စွန်"],["lion","🦁","ခြင်္သေ့"],["lemon","🍋","ရှောက်ချဉ်သီး"],
  ["moon","🌙","လ"],["milk","🥛","နို့"],["nose","👃","နှာခေါင်း"],["orange","🍊","လိမ္မော်သီး"],["owl","🦉","ဇီးကွက်"],
  ["pig","🐷","ဝက်"],["pizza","🍕","ပီဇာ"],["queen","👸","မိဖုရား"],["rabbit","🐰","ယုန်"],["rain","🌧️","မိုး"],
  ["sun","☀️","နေ"],["snake","🐍","မြွေ"],["tree","🌳","သစ်ပင်"],["tiger","🐯","ကျား"],["umbrella","☂️","ထီး"],
  ["van","🚐","ဗင်ကား"],["violin","🎻","တယော"],["water","💧","ရေ"],["watch","⌚","လက်ပတ်နာရီ"],["yellow","","အဝါရောင်"],["zebra","🦓","မြင်းကျား"]
].map(([en, e, my]) => ({ en, e, my }));
const lessonWords = () => topic.words.filter(w => /^[a-z]+$/.test(w.en)).map(w => ({ en: w.en, e: "", my: w.my }));
const first = w => w.en[0].toUpperCase();
const lab = w => (w.e ? w.e + " " : "") + w.en;
const LOOK = { B: "DPR", D: "BOP", P: "BDQ", Q: "GOP", G: "CQO", M: "NW", N: "MH", U: "VW", V: "UW", W: "VM", I: "LJT", L: "IJ", C: "EOG", E: "CF", O: "CQ", H: "NM", F: "EP", R: "BP", T: "IY", Y: "VT", S: "Z", Z: "S" };

function pickLetters(ans, avoid, n) {
  const near = [];
  for (let d = -4; d <= 4; d++) { const i = A.indexOf(ans) + d; if (d && A[i]) near.push(A[i]); }
  const pool = shuffle([...new Set(near.concat((LOOK[ans] || "").split("")))]).concat(shuffle(A));
  return [...new Set(pool)].filter(x => x !== ans && !avoid.includes(x)).slice(0, n);
}
const caseOf = (ch, lower) => lower ? ch.toLowerCase() : ch;

// every builder returns { label, cars:[{t,gap}], my?, speak?, options, answer, explain, letters }
const MAKE = {
  next(lower) {
    const s = Math.floor(Math.random() * 24), shown = [s, s + 1], ans = A[s + 2];
    const low = lower;
    return { label: "နောက်ထပ်ကားတွဲမှာ ဘာစာလုံးလဲ?", cars: [...shown.map(i => ({ t: caseOf(A[i], low) })), { t: "?", gap: true }],
      options: [ans, ...pickLetters(ans, shown.map(i => A[i]), LV.opts - 1)].map(x => caseOf(x, low)), answer: caseOf(ans, low), letters: true, speak: ans,
      explain: A[s] + " " + A[s + 1] + " " + ans + " — " + A[s + 1] + " ပြီးရင် " + ans + " လာတယ်" };
  },
  before(lower) {
    const s = Math.floor(Math.random() * 24), ans = A[s], shown = [s + 1, s + 2];
    return { label: "ရှေ့ကားတွဲမှာ ဘာစာလုံးလဲ?", cars: [{ t: "?", gap: true }, ...shown.map(i => ({ t: caseOf(A[i], lower) }))],
      options: [ans, ...pickLetters(ans, shown.map(i => A[i]), LV.opts - 1)].map(x => caseOf(x, lower)), answer: caseOf(ans, lower), letters: true, speak: ans,
      explain: ans + " " + A[s + 1] + " " + A[s + 2] + " — " + A[s + 1] + " ရဲ့ ရှေ့မှာ " + ans + " ရှိတယ်" };
  },
  missing(lower) {
    const s = Math.floor(Math.random() * 24), ans = A[s + 1], shown = [s, s + 2];
    return { label: "ကားတွဲတစ်ခု ပျောက်နေတယ်၊ ဘာစာလုံးလဲ?", cars: [{ t: caseOf(A[s], lower) }, { t: "?", gap: true }, { t: caseOf(A[s + 2], lower) }],
      options: [ans, ...pickLetters(ans, shown.map(i => A[i]), LV.opts - 1)].map(x => caseOf(x, lower)), answer: caseOf(ans, lower), letters: true, speak: ans,
      explain: A[s] + " " + ans + " " + A[s + 2] + " — " + A[s] + " နဲ့ " + A[s + 2] + " ကြားထဲမှာ " + ans + " ရှိတယ်" };
  },
  up() {
    const ans = A[Math.floor(Math.random() * 26)];
    return { label: "စာလုံးကြီးနဲ့ တူတဲ့ စာလုံးသေးကို ရွေးပါ", cars: [{ t: ans }], answer: ans.toLowerCase(), letters: true, speak: ans,
      options: [ans.toLowerCase(), ...pickLetters(ans, [], LV.opts - 1).map(x => x.toLowerCase())],
      explain: ans + " (စာလုံးကြီး) = " + ans.toLowerCase() + " (စာလုံးသေး)" };
  },
  low() {
    const ans = A[Math.floor(Math.random() * 26)];
    return { label: "စာလုံးသေးနဲ့ တူတဲ့ စာလုံးကြီးကို ရွေးပါ", cars: [{ t: ans.toLowerCase() }], answer: ans, letters: true, speak: ans,
      options: [ans, ...pickLetters(ans, [], LV.opts - 1)],
      explain: ans.toLowerCase() + " (စာလုံးသေး) = " + ans + " (စာလုံးကြီး)" };
  },
  word(pool) {
    const L = [...new Set(pool.map(first))];
    const ans = L[Math.floor(Math.random() * L.length)];
    const right = shuffle(pool.filter(w => first(w) === ans))[0];
    const wrong = [], used = new Set([ans]);
    shuffle(pool).forEach(w => { if (wrong.length < LV.opts - 1 && !used.has(first(w))) { used.add(first(w)); wrong.push(w); } });
    return { label: "ဒီစာလုံးနဲ့ စတဲ့ စကားလုံးကို ရွေးပါ", cars: [{ t: ans + " " + ans.toLowerCase(), wide: true }], answer: lab(right), speak: right.en,
      options: [right, ...wrong].map(lab),
      explain: right.en + " (" + right.my + ") က " + ans + " နဲ့ စတယ်" };
  },
  letter(pool) {
    const w = shuffle(pool.filter(x => x.e))[0], ans = first(w);
    return { label: "ဒီစကားလုံးက ဘာစာလုံးနဲ့ စလဲ?", cars: [{ t: w.e + " " + w.en, wide: true }], answer: ans, letters: true, speak: w.en,
      options: [ans, ...pickLetters(ans, [], LV.opts - 1)],
      explain: w.en + " (" + w.my + ") က " + ans + " နဲ့ စတယ်" };
  }
};

$("#app").innerHTML =
  '<div class="stats"><span>Question: <b id="qn">1</b>/' + N + '</span><span>Streak: <b id="streak">0</b> 🔥</span><span>Score: <b id="score">0</b></span></div>' +
  '<div class="al-track" aria-hidden="true"><div class="rail"></div><div class="stops" id="stops"></div><div class="al-engine" id="engine">🚂</div></div>' +
  (LV.secs ? '<div class="timer"><i id="tbar"></i></div>' : '') +
  '<div class="panel"><div class="q-label" id="qlabel"></div><div class="al-train" id="train" aria-live="polite"></div>' +
  '<button class="btn" id="say" style="min-height:44px">🔊 Listen</button><div class="opts" id="opts"></div>' +
  '<div class="fb" id="fb" aria-live="polite"></div><button class="btn primary" id="next" hidden>Next →</button></div>';

let qs, i, correct, streak, score, answered, tick, marks;

function build() {
  const pool = WORDS.concat(lessonWords());
  const lowerOK = () => lvl >= 2 && Math.random() < 0.5;
  const kinds = shuffle(["next", "before", "missing", "up", "low", "word", "word", "letter", "next", "missing"]);
  return kinds.map(k => {
    const q = MAKE[k](k === "word" || k === "letter" ? pool : lowerOK());
    q.options = shuffle([...new Set(q.options)]);
    return q;
  });
}
function play() {
  clearInterval(tick);
  qs = build(); i = 0; correct = 0; streak = 0; score = 0; marks = [];
  $("#stops").innerHTML = qs.map(() => "<i></i>").join("");
  show();
}
function show() {
  answered = false;
  const q = qs[i];
  $("#qn").textContent = i + 1; $("#streak").textContent = streak; $("#score").textContent = score;
  $("#qlabel").textContent = q.label;
  const eng = $("#engine"), W = $(".al-track").clientWidth;
  eng.style.left = Math.max(0, (W - 40) * (i / (N - 1))) + "px";
  [...$("#stops").children].forEach((s, n) => { s.className = marks[n] || ""; });
  const tr = $("#train"); tr.innerHTML = '<span class="eng" aria-hidden="true">🚂</span>';
  q.cars.forEach(c => {
    const d = document.createElement("div");
    d.className = "al-car" + (c.gap ? " gap" : "") + (c.wide ? " wide" : "");
    d.textContent = c.t;
    tr.appendChild(d);
  });
  $("#say").onclick = () => speak(q.speak);
  $("#say").hidden = !q.speak;
  const box = $("#opts"); box.innerHTML = ""; box.classList.toggle("letters", !!q.letters);
  q.options.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => choose(b, o === q.answer);
    box.appendChild(b);
  });
  $("#fb").textContent = ""; $("#fb").className = "fb"; $("#next").hidden = true;
  clearInterval(tick);
  if (LV.secs) {
    const t0 = Date.now(); $("#tbar").style.transform = "scaleX(1)";
    tick = setInterval(() => {
      const left = Math.max(0, 1 - (Date.now() - t0) / (LV.secs * 1000));
      $("#tbar").style.transform = "scaleX(" + left + ")";
      if (left === 0) choose(null, false);
    }, 100);
  }
}
function choose(btn, ok) {
  if (answered) return;
  answered = true; clearInterval(tick);
  const q = qs[i], fb = $("#fb");
  [...$("#opts").children].forEach(b => { b.disabled = true; if (b.textContent === q.answer) b.classList.add("right"); });
  const gap = $(".al-car.gap");
  if (ok) {
    correct++; streak++; marks[i] = "ok";
    const pts = 10 + Math.min(streak - 1, 5) * 2; score += pts; addPoints(pts); sfx.ok();
    fb.className = "fb ok"; fb.textContent = "✓ မှန်ပါတယ်! +" + pts;
    if (gap) { gap.textContent = q.answer; gap.classList.remove("gap"); gap.classList.add("solved"); }
  } else {
    streak = 0; marks[i] = "no"; sfx.bad(); if (btn) btn.classList.add("wrong");
    fb.className = "fb no"; fb.textContent = btn ? "✗ မှားပါတယ်။" : "⏱ အချိန်ကုန်သွားပါပြီ။";
  }
  fb.appendChild(document.createElement("br")); fb.appendChild(document.createTextNode(q.explain));
  [...$("#stops").children].forEach((s, n) => { s.className = marks[n] || ""; });
  $("#streak").textContent = streak; $("#score").textContent = score;
  const n = $("#next"); n.hidden = false; n.textContent = i === N - 1 ? "Finish" : "Next →"; n.focus();
}
$("#next").onclick = () => {
  if (i < N - 1) { i++; show(); return; }
  clearInterval(tick);
  const r = correct / N;
  showResult({ title: cheer(r), stars: starsFor(r), text: correct + " / " + N + " မှန်တယ် · " + score + " points", onAgain: play });
};
document.addEventListener("keydown", e => {
  if (answered || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".overlay")) return;
  const n = parseInt(e.key, 10), b = $("#opts").children[n - 1];
  if (n >= 1 && b) b.click();
});
play.gameId = "alphabet";
play();
</script>
</body>
</html>
