<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch the Word</title>
<link rel="stylesheet" href="css/style.css">
<style>
.bc-q { padding: 10px 16px; }
.bc-q .q-text { margin: 0; }
.bc-area { position: relative; height: 350px; margin-top: 10px; border-radius: 22px; overflow: hidden; border: 2px solid var(--line); touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ew-resize;
  background: linear-gradient(color-mix(in srgb, #4dabf7 34%, var(--card)), color-mix(in srgb, #4dabf7 8%, var(--card)) 70%, color-mix(in srgb, var(--good) 24%, var(--card))); }
.bc-area::before { content: "☁️          ☁️"; position: absolute; top: 8px; left: 8%; right: 8%; font-size: 2rem; opacity: .5; white-space: pre; text-align: center; animation: bcdrift 18s linear infinite alternate; pointer-events: none; }
@keyframes bcdrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
.bc-grass { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: linear-gradient(#5fb85f, #3d9143); border-top: 3px solid #7ad07a; z-index: 1; }
.bc-w { position: absolute; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; z-index: 2; will-change: transform; pointer-events: none; }
.bc-w .dome { width: 78%; height: 22px; border-radius: 50% 50% 4px 4px / 100% 100% 4px 4px; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--k) 40%, #fff), var(--k)); border-bottom: 3px solid rgba(0,0,0,.15); position: relative; }
.bc-w .dome::after { content: ""; position: absolute; left: 12%; right: 12%; top: 100%; height: 12px; background: linear-gradient(80deg, transparent 49%, rgba(0,0,0,.35) 50%, transparent 52%) 0 0 / 50% 100%, linear-gradient(100deg, transparent 49%, rgba(0,0,0,.35) 50%, transparent 52%) 100% 0 / 50% 100%; background-repeat: no-repeat; }
.bc-w .txt { margin-top: 10px; min-width: 78px; max-width: 108px; min-height: 46px; padding: 4px 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: .92rem; line-height: 1.2; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); word-break: break-word;
  border-radius: 14px; background: linear-gradient(color-mix(in srgb, var(--k) 70%, #fff), var(--k)); box-shadow: 0 4px 0 rgba(0,0,0,.2), 0 6px 10px rgba(0,0,0,.2); }
.bc-w.good .txt { background: var(--good); outline: 3px solid #fff; } .bc-w.bad .txt { background: var(--bad); outline: 3px solid #fff; }
.bc-w.gone { transition: opacity .35s; opacity: 0; }
.bc-basket { position: absolute; bottom: 12px; left: 0; width: 84px; margin-left: -42px; text-align: center; font-size: 3.6rem; line-height: 1; z-index: 3; will-change: transform; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
.bc-basket span { display: inline-block; }
.bc-basket.yes span { animation: bcyes .45s; } .bc-basket.no span { animation: bcno .4s; }
@keyframes bcyes { 30% { transform: scale(1.25, .8); } 60% { transform: scale(.92, 1.15); } } @keyframes bcno { 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
.bc-ctl { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
.bc-ctl button { flex: 1; max-width: 190px; min-height: 60px; font-size: 1.8rem; border-radius: 18px; border: 3px solid var(--accent); background: var(--card); color: var(--accent); cursor: pointer; font-weight: 900; box-shadow: 0 5px 0 var(--accent); touch-action: none; user-select: none; -webkit-user-select: none; }
.bc-ctl button:active, .bc-ctl button.hold { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); }
.bc-msg { text-align: center; font-weight: 800; min-height: 3.4em; margin-top: 10px; line-height: 1.6; }
.bc-msg.ok { color: var(--good); } .bc-msg.no { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .bc-area::before { animation: none; } .bc-basket.yes span, .bc-basket.no span { animation: none; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app"></main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script src="js/fx.js"></script>
<script>
// Move the basket, catch the falling word that answers the question.
const topic = getTopic(), LV = getLevel(), lvl = topic.level;
renderBar("Catch the Word · " + topic.name);
const WAVES = 10, LIVES = [5, 4, 3, 3][lvl - 1], TINTS = ["#e8590c", "#7048e8", "#1c7ed6", "#d6336c", "#2f9e44"];
const FALL_S = 4.6 * LV.pace;        // seconds for a word to fall the whole area (a bit quicker every wave)

$("#app").innerHTML =
  '<div class="stats"><span>Wave: <b id="rn">1</b>/' + WAVES + '</span><span class="hearts" id="lives"></span><span>Score: <b id="score">0</b></span></div>' +
  '<div class="panel bc-q"><div class="q-label" id="qlabel"></div><div class="q-text" id="qtext"></div>' +
  '<button class="btn" id="say" style="min-height:44px;margin-top:2px">🔊 Listen</button></div>' +
  '<div class="bc-area" id="area"><div class="bc-grass"></div><div class="bc-basket" id="basket"><span>🧺</span></div></div>' +
  '<div class="bc-ctl"><button id="bl" aria-label="Move left">◀</button><button id="br" aria-label="Move right">▶</button></div>' +
  '<div class="bc-msg" id="msg" aria-live="polite"></div>';

let run = 0, qs, wave, lives, score, clean, q, words, state, bx, target, last, raf, dirHold = 0, wrongHit;
const keys = { l: 0, r: 0 }, timers = new Set(), area = $("#area"), basket = $("#basket");
function later(fn, ms) { const id = run; const t = setTimeout(() => { timers.delete(t); if (id === run) fn(); }, ms); timers.add(t); }
function msg(t, c) { const m = $("#msg"); m.textContent = t; m.className = "bc-msg " + (c || ""); }
function paint() { $("#lives").textContent = hearts(lives, LIVES); $("#score").textContent = score; $("#rn").textContent = Math.min(wave, WAVES); }
const W = () => area.clientWidth, H = () => area.clientHeight;
function clampX(x) { const w = W(); return Math.max(40, Math.min(w - 40, x)); }

function play() {
  run++; timers.forEach(clearTimeout); timers.clear(); cancelAnimationFrame(raf);
  const kinds = [Q.enMy, Q.myEn, Q.hear, Q.listen], off = Math.floor(Math.random() * 4);
  qs = take(topic.words, WAVES).map((w, k) => {
    const x = kinds[(k + off) % 4](topic, w);
    x.options = shuffle([x.answer, ...shuffle(x.options.filter(o => o !== x.answer)).slice(0, 2)]);   // 1 right + 2 wrong
    return x;
  });
  wave = 0; lives = LIVES; score = 0; clean = 0; bx = target = W() / 2; state = "idle";
  area.querySelectorAll(".bc-w").forEach(e => e.remove());
  paint(); next();
  last = performance.now(); raf = requestAnimationFrame(loop);
}
function next() {
  area.querySelectorAll(".bc-w").forEach(e => e.remove());
  if (wave >= WAVES || lives <= 0) return end();
  q = qs[wave]; wave++; wrongHit = false; paint();
  $("#qlabel").textContent = q.label;
  const qt = $("#qtext"); qt.textContent = q.text; qt.className = "q-text" + (q.my ? " my" : "");
  qt.style.fontSize = "clamp(1.5rem, 6.5vw, 2rem)";
  $("#say").hidden = !q.speak; $("#say").onclick = () => speak(q.speak);
  if (q.speak && q.auto) speak(q.speak);
  msg("🧺 ခြင်းတောင်းကို ရွှေ့ပြီး မှန်တဲ့စကားလုံးကို ဖမ်းပါ");
  const cols = shuffle([0.2, 0.5, 0.8]), starts = shuffle([0, 1, 2]);
  words = q.options.map((t, i) => {
    const el = document.createElement("div"), k = TINTS[(i + wave) % TINTS.length];
    el.className = "bc-w"; el.style.setProperty("--k", k);
    el.innerHTML = '<span class="dome"></span><span class="txt"></span>'; $(".txt", el).textContent = t;
    area.insertBefore(el, basket);
    const w = el.offsetWidth, x = Math.max(w / 2 + 4, Math.min(W() - w / 2 - 4, cols[i] * W()));
    return { el, t, x, y: -80 - starts[i] * 55, v: H() / (FALL_S * (1 - Math.min(wave, 10) * 0.025)), done: false, ok: t === q.answer, w };
  });
  state = "fall";
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const d = (keys.r - keys.l) + dirHold;
  if (d) target = clampX(target + d * W() * 1.05 * dt);
  bx += (target - bx) * Math.min(1, dt * 16);
  basket.style.transform = "translateX(" + bx + "px)";
  if (state === "fall") {
    const h = H(), top = h - 78;
    words.forEach(o => {
      if (o.done) return;
      o.y += o.v * dt;
      o.el.style.transform = "translate(" + (o.x - o.w / 2) + "px," + o.y + "px)";
      const bottom = o.y + 86;
      if (bottom >= top && bottom <= top + 52 && Math.abs(o.x - bx) < 40 + o.w * 0.22) hit(o);
      else if (o.y > h) { o.done = true; o.ok ? missed(o) : o.el.classList.add("gone"); }
    });
  }
  raf = requestAnimationFrame(loop);
}
function hit(o) {
  if (o.done || state !== "fall") return;
  o.done = true;
  const p = fx.at(basket);
  if (o.ok) {
    state = "won"; if (!wrongHit) clean++;
    const pts = wrongHit ? 5 : 10; score += pts; addPoints(pts); sfx.ok(); paint();
    o.el.classList.add("good"); basket.classList.remove("no"); basket.classList.add("yes"); later(() => basket.classList.remove("yes"), 500);
    fx.confetti(p.x, p.y - 30, 34); fx.pop(basket, "+" + pts); speak(q.explain.split(" = ")[0]);
    msg("✓ မှန်ပါတယ်! " + q.explain, "ok");
    words.forEach(x => { if (x !== o) { x.done = true; x.el.classList.add("gone"); } });
    later(() => { o.el.classList.add("gone"); }, 500);
    later(next, 1500);
  } else {
    wrongHit = true; lives--; sfx.bad(); paint();
    o.el.classList.add("bad"); basket.classList.remove("yes"); basket.classList.add("no"); later(() => basket.classList.remove("no"), 450);
    fx.pop(basket, "💥", "bad"); later(() => o.el.classList.add("gone"), 350);
    msg("✗ " + o.t + " မဟုတ်ဘူး! ❤️ တစ်ခု လျော့သွားတယ်", "no");
    if (lives <= 0) { state = "over"; later(end, 1200); }
  }
}
function missed(o) {
  state = "missed"; if (!wrongHit) wrongHit = true; lives--; sfx.bad(); paint();
  o.el.classList.remove("gone"); o.el.classList.add("good"); o.el.style.opacity = 1;
  o.el.style.transform = "translate(" + (o.x - o.w / 2) + "px," + (H() - 130) + "px)";
  msg("✗ မမိလိုက်ဘူး! အဖြေက " + q.explain, "no");
  words.forEach(x => { if (x !== o) x.el.classList.add("gone"); x.done = true; });
  if (lives <= 0) { state = "over"; later(end, 1800); } else later(next, 2200);
}
function end() {
  cancelAnimationFrame(raf); state = "idle";
  const dead = lives <= 0, r = clean / WAVES; if (!dead) fx.rain(50);
  showResult({ title: dead ? "❤️ ကုန်သွားပြီ 💪" : cheer(r), stars: Math.max(1, starsFor(r)), text: "စကားလုံး " + clean + " / " + WAVES + " ခု ပြည့်စုံစွာ ဖမ်းမိတယ် · " + score + " points", onAgain: play });
}
// controls (registered once; play() just resets state)
function setTarget(e) { const r = area.getBoundingClientRect(); target = clampX(e.clientX - r.left); }
area.addEventListener("pointerdown", setTarget);
area.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons) setTarget(e); });
addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") { keys.l = 1; e.preventDefault(); }
  if (k === "ArrowRight" || k === "d" || k === "D") { keys.r = 1; e.preventDefault(); }
});
addEventListener("keyup", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.l = 0;
  if (k === "ArrowRight" || k === "d" || k === "D") keys.r = 0;
});
addEventListener("blur", () => { keys.l = keys.r = 0; dirHold = 0; });
[["#bl", -1], ["#br", 1]].forEach(([s, d]) => {
  const b = $(s), stop = () => { if (dirHold === d) dirHold = 0; b.classList.remove("hold"); };
  b.addEventListener("pointerdown", e => { dirHold = d; b.classList.add("hold"); try { b.setPointerCapture(e.pointerId); } catch (x) {} });
  b.addEventListener("pointerup", stop); b.addEventListener("pointercancel", stop); b.addEventListener("lostpointercapture", stop);
  b.addEventListener("click", e => { if (e.detail === 0) target = clampX(target + d * 50); });
});
play.gameId = "basketcatch";
play();
</script>
</body>
</html>
