// Each game lives under exactly one level (`from`), so no game repeats across levels.
// Content here is only a sample lesson per level: the last lesson of that level's unit.
// Real content (from video transcripts) is chosen outside this page via ?lesson=...&level=...
let level = Store.get("levelpick", 1);
if (!LEVELS[level]) level = 1;

function sampleLesson(lv) {
  const unit = UNITS.find(u => u.level === lv) || UNITS[0];
  const last = TOPICS.filter(t => t.unit === unit.n).pop();
  return { lesson: last.id, boss: "boss" + unit.n, name: last.name };
}
function renderLevels() {
  const box = $("#lvpick");
  box.innerHTML = "";
  [1, 2, 3, 4].forEach(n => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", level === n);
    b.textContent = "Lv " + n;
    b.onclick = () => { level = n; Store.set("levelpick", n); render(); };
    box.appendChild(b);
  });
}
function renderGames() {
  const lv = LEVELS[level];
  const sample = sampleLesson(level);
  $("#lvinfo").textContent = "Lv " + level + " " + lv.name + " (" + lv.mm + ")" +
    (lv.secs ? " · မေးခွန်းတစ်ခုကို " + lv.secs + " စက္ကန့်" : " · အချိန်မကန့်ဘူး") +
    (lv.review ? " · အရင်သင်ခန်းစာက စာလုံး " + lv.review + " လုံး ပြန်ပါမယ်" : "") +
    " · Game " + GAMES.filter(g => g.from === level).length + " ခု";
  const box = $("#games");
  box.innerHTML = "";
  GAMES.filter(g => g.from === level).forEach(g => {
    const lesson = g.boss ? sample.boss : sample.lesson;
    const a = document.createElement("a");
    a.className = "game";
    a.href = g.file + "?lesson=" + encodeURIComponent(lesson) + "&level=" + level;
    a.innerHTML = '<div class="ic"></div><div class="nm"></div><div class="ds"></div><div class="stars"></div>';
    $(".ic", a).textContent = g.ic;
    $(".nm", a).textContent = g.nm + (g.boss ? " · Boss" : "");
    $(".ds", a).textContent = g.ds;
    $(".stars", a).innerHTML = starsHtml(Store.get("stars_" + g.id + "_" + lesson, 0));
    box.appendChild(a);
  });
  $("#pts").textContent = "⭐ " + Store.get("points", 0) + " points";
}
function render() { renderLevels(); renderGames(); }
render();
</script>
