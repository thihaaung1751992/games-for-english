<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Quiz</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="stats"><span>Question: <b id="qn">1</b>/<span id="qt">8</span></span><span>Streak: <b id="streak">0</b> 🔥</span><span>Score: <b id="score">0</b></span></div>
  <div class="timer" id="timerWrap" hidden><i id="timerBar"></i></div>
  <div class="panel">
    <div class="q-label" id="qlabel"></div>
    <div class="q-text" id="qtext"></div>
    <button class="btn" id="say" aria-label="Listen">🔊 Listen</button>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="btn primary" id="next" hidden>Next →</button>
  </div>
  <label class="toggle"><input type="checkbox" id="timerOn"> ⏱ အချိန်ကန့်ပြီး ကစားမယ် (၁၅ စက္ကန့်)</label>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const topic = getTopic();
renderBar("Quick Quiz · " + topic.name);
const LIMIT = 15000;
let qs, i, correct, streak, score, answered, tick, tStart;
$("#timerOn").checked = Store.get("timer", false);
$("#timerOn").onchange = e => { Store.set("timer", e.target.checked); play(); };

function play() {
  qs = shuffle(topic.words).map((w, n) => ({ w, toMy: n % 2 === 0 }));
  i = 0; correct = 0; streak = 0; score = 0;
  $("#qt").textContent = qs.length;
  show();
}
function show() {
  answered = false;
  const q = qs[i], w = q.w;
  $("#qn").textContent = i + 1; $("#streak").textContent = streak; $("#score").textContent = score;
  $("#qlabel").textContent = q.toMy ? "English → မြန်မာ" : "မြန်မာ → English";
  const qt = $("#qtext");
  qt.textContent = q.toMy ? w.en : w.my;
  qt.className = "q-text" + (q.toMy ? "" : " my");
  $("#say").hidden = !q.toMy;
  $("#say").onclick = () => speak(w.en);
  if (q.toMy) speak(w.en);
  const wrong = shuffle(topic.words.filter(x => x !== w)).slice(0, 3);
  const opts = shuffle([w, ...wrong]);
  const box = $("#opts");
  box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = q.toMy ? o.my : o.en;
    b.onclick = () => choose(b, o === w);
    box.appendChild(b);
  });
  $("#fb").textContent = ""; $("#fb").className = "fb";
  $("#next").hidden = true;
  startTimer();
}
function startTimer() {
  clearInterval(tick);
  const on = $("#timerOn").checked;
  $("#timerWrap").hidden = !on;
  if (!on) return;
  tStart = Date.now();
  tick = setInterval(() => {
    const left = Math.max(0, 1 - (Date.now() - tStart) / LIMIT);
    $("#timerBar").style.transform = "scaleX(" + left + ")";
    if (left === 0) choose(null, false);
  }, 100);
}
function choose(btn, ok) {
  if (answered) return;
  answered = true; clearInterval(tick);
  const q = qs[i], w = q.w;
  const right = q.toMy ? w.my : w.en;
  [...$("#opts").children].forEach(b => { b.disabled = true; if (b.textContent === right) b.classList.add("right"); });
  const fb = $("#fb");
  if (ok) {
    correct++; streak++;
    const pts = 10 + Math.min(streak - 1, 5) * 2;
    score += pts; addPoints(pts); sfx.ok();
    fb.className = "fb ok"; fb.textContent = "✓ မှန်ပါတယ်! +" + pts;
  } else {
    streak = 0; sfx.bad();
    if (btn) btn.classList.add("wrong");
    fb.className = "fb no";
    fb.textContent = (btn ? "✗ မှားပါတယ်။ " : "⏱ အချိန်ကုန်သွားပါပြီ။ ") + w.en + " = " + w.my;
  }
  fb.appendChild(document.createElement("br"));
  fb.appendChild(document.createTextNode(w.ex));
  $("#streak").textContent = streak; $("#score").textContent = score;
  const n = $("#next");
  n.hidden = false;
  n.textContent = i === qs.length - 1 ? "Finish" : "Next →";
  n.focus();
}
$("#next").onclick = () => {
  if (i < qs.length - 1) { i++; show(); return; }
  const pct = correct / qs.length;
  showResult({
    title: pct >= 0.9 ? "အရမ်းတော်တယ်! 🎉" : pct >= 0.7 ? "ကောင်းပါတယ်! 👍" : "ထပ်ကြိုးစားကြည့်ပါ 💪",
    stars: pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1,
    text: correct + " / " + qs.length + " မှန်တယ် · " + score + " points",
    onAgain: play
  });
};
play.gameId = "quiz";
play();
</script>
</body>
</html>
