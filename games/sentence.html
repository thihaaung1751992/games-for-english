<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Builder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="stats"><span>Sentence: <b id="sn">1</b>/<span id="st">8</span></span><span>Score: <b id="score">0</b></span></div>
  <div class="panel">
    <div class="q-label">စကားလုံးတွေကို အစီအစဉ်ကျ စီပြီး ဝါကျဖွဲ့ပါ</div>
    <div class="q-text my" id="clue" style="font-size:clamp(1.2rem,5vw,1.6rem)"></div>
    <div class="chips line" id="line" aria-label="Your sentence"></div>
    <div class="chips" id="bank" aria-label="Words"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="clear">Clear</button>
      <button class="btn" id="skip">Skip</button>
      <button class="btn primary" id="next" hidden>Next →</button>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
const topic = getTopic();
renderBar("Sentence Builder · " + topic.name);
let list, i, score, solved, toks, placed, locked, base;

function play() { list = shuffle(topic.words); i = 0; score = 0; solved = 0; $("#st").textContent = list.length; show(); }
function show() {
  const w = list[i];
  locked = false; placed = [];
  base = w.ex.split(" ");
  let arr = base.map((t, id) => ({ t, id }));
  for (let n = 0; n < 10 && arr.map(x => x.t).join(" ") === w.ex; n++) arr = shuffle(arr);
  toks = arr;
  $("#sn").textContent = i + 1; $("#score").textContent = score;
  $("#clue").textContent = w.exMy;
  $("#fb").textContent = ""; $("#fb").className = "fb";
  $("#next").hidden = true; $("#clear").disabled = false; $("#skip").disabled = false;
  draw();
}
function draw() {
  const line = $("#line"), bank = $("#bank");
  line.innerHTML = ""; bank.innerHTML = "";
  line.className = "chips line";
  placed.forEach((p, n) => {
    const b = document.createElement("button");
    b.className = "chip placed"; b.textContent = p.t;
    b.onclick = () => { if (!locked) { placed.splice(n, 1); draw(); } };
    line.appendChild(b);
  });
  toks.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = p.t;
    b.disabled = placed.some(x => x.id === p.id);
    b.onclick = () => { if (!locked) { placed.push(p); draw(); if (placed.length === toks.length) check(); } };
    bank.appendChild(b);
  });
}
function check() {
  const w = list[i], ok = placed.map(p => p.t).join(" ") === w.ex, line = $("#line"), fb = $("#fb");
  locked = true;
  if (ok) {
    solved++; score += 10; addPoints(10); sfx.ok(); speak(w.ex);
    line.classList.add("good"); fb.className = "fb ok"; fb.textContent = "✓ မှန်ပါတယ်!";
    $("#clear").disabled = true; $("#skip").disabled = true;
    const n = $("#next"); n.hidden = false; n.textContent = i === list.length - 1 ? "Finish" : "Next →"; n.focus();
    $("#score").textContent = score;
  } else {
    sfx.bad(); line.classList.add("bad"); fb.className = "fb no"; fb.textContent = "အစီအစဉ် မမှန်သေးပါဘူး၊ ထပ်ကြိုးစားပါ";
    setTimeout(() => { placed = []; fb.textContent = ""; locked = false; draw(); }, 800);
  }
}
function advance() {
  if (i < list.length - 1) { i++; show(); return; }
  const pct = solved / list.length;
  showResult({
    title: "ပြီးပါပြီ! 🎉", stars: pct === 1 ? 3 : pct >= 0.7 ? 2 : 1,
    text: solved + " / " + list.length + " ကြောင်း မှန်တယ် · " + score + " points",
    onAgain: play
  });
}
$("#clear").onclick = () => { if (!locked) { placed = []; draw(); } };
$("#skip").onclick = advance;
$("#next").onclick = advance;
play.gameId = "sentence";
play();
</script>
</body>
</html>
