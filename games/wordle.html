<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Guess</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root { --bg: #0b1020; --card: #151d36; --ink: #f1f5ff; --muted: #9aa8c7; --line: #2b3858; --accent: #2dd4bf; --good: #34d399; --bad: #fb7185; --star: #fbbf24;
  --c-g: #2f9e62; --c-y: #d19b16; --c-x: #3a4663; --empty: #38466a; --typed: #8396c2; }
body.hc { --c-g: #f5793a; --c-y: #4aa8ff; }
body {
  background: radial-gradient(700px 420px at 50% -8%, rgba(45,212,191,.2), transparent 60%), radial-gradient(600px 400px at 100% 100%, rgba(129,140,248,.16), transparent 60%), var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 520px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.rounds { display: flex; gap: 6px; align-items: center; }
.rd { width: 12px; height: 12px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
.rd.cur { background: var(--accent); animation: beat 1.4s infinite; }
.rd.win { background: var(--good); } .rd.lose { background: var(--bad); }
@keyframes beat { 50% { transform: scale(1.35); } }
.chip { font: inherit; font-size: .85rem; font-weight: 700; min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1.5px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); cursor: pointer; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
.chip[aria-pressed="true"] { background: linear-gradient(90deg, var(--c-g), var(--c-y)); border-color: transparent; color: #fff; }
.score { font-weight: 800; font-variant-numeric: tabular-nums; }

.clue {
  position: relative; text-align: center; padding: 14px 16px; border-radius: 20px; margin-bottom: 14px;
  background: linear-gradient(135deg, rgba(45,212,191,.16), rgba(99,102,241,.16)); border: 1px solid rgba(255,255,255,.12);
}
.clue .q-label { color: var(--accent); }
.clue .q-text { font-size: clamp(1.7rem, 8vw, 2.4rem); margin: 2px 0; }
.clue .len { color: var(--muted); font-size: .9rem; }
.hintline { min-height: 1.6em; color: var(--star); font-weight: 700; font-size: .95rem; margin-top: 2px; }

.board { display: grid; gap: 6px; margin: 0 auto 12px; position: relative; }
.wrow { display: grid; gap: 6px; }
.t {
  position: relative; aspect-ratio: 1; min-width: 0; border-radius: 10px; border: 2px solid var(--empty); background: transparent; color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(1.2rem, 6vw, 1.9rem); text-transform: uppercase; line-height: 1;
}
.t.typed { border-color: var(--typed); }
.t.g { background: var(--c-g); border-color: var(--c-g); } .t.y { background: var(--c-y); border-color: var(--c-y); } .t.x { background: var(--c-x); border-color: var(--c-x); color: #c8d2ee; }
.t::after { position: absolute; top: 2px; right: 4px; font-size: .5em; font-weight: 900; opacity: .8; }
.t.g::after { content: "✓"; } .t.y::after { content: "↔"; } .t.x::after { content: "✕"; opacity: .45; }
.t.cur { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }

.toast {
  position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%); background: #f8fafc; color: #0f172a; font-weight: 800; padding: 8px 16px; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); white-space: nowrap; opacity: 0; pointer-events: none; z-index: 5; font-size: .95rem;
}
.toast.on { animation: toast 1.6s; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -80%); } 10%, 80% { opacity: 1; transform: translate(-50%, -100%); } 100% { opacity: 0; } }

.legend { font-size: .8rem; color: var(--muted); text-align: center; margin-bottom: 8px; }
.wkb { margin: 6px 0 10px; }
.wkb div { display: flex; gap: 5px; justify-content: center; margin-bottom: 7px; }
.wkb button {
  flex: 1 1 0; min-width: 0; max-width: 42px; height: 54px; border-radius: 9px; border: 0; background: #2a3658; color: var(--ink); font: inherit; font-weight: 800;
  text-transform: uppercase; cursor: pointer; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.35); transition: background .3s, transform .08s, box-shadow .08s;
}
.wkb button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.wkb button.wide { max-width: 68px; flex-grow: 1.6; font-size: .78rem; text-transform: none; background: #3d4d78; }
.wkb button.g { background: var(--c-g); } .wkb button.y { background: var(--c-y); } .wkb button.x { background: #161d33; color: #6b7a9f; }
.wkb button:disabled { opacity: .5; cursor: default; }

.fb { min-height: 3.6em; text-align: center; margin: 8px 0; }
.fb.ok { color: var(--good); } .fb.no { color: var(--bad); }
.fb b { font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; }
.fb .exm { display: block; color: var(--muted); font-size: .9rem; }
.nextrow { text-align: center; }
@media (prefers-reduced-motion: reduce) { .rd.cur, .toast.on { animation: none; } .toast.on { opacity: 1; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="top">
    <div class="rounds" id="rounds" aria-label="Rounds"></div>
    <span class="score">⭐ <span id="score">0</span></span>
    <span style="display:flex;gap:6px">
      <button class="chip" id="hint" type="button">💡 Hint</button>
      <button class="chip" id="hc" type="button" aria-pressed="false" title="High-contrast colours for colour-blind players">◐ Contrast</button>
    </span>
  </div>
  <div class="clue">
    <div class="q-label">အဓိပ္ပါယ်ကို ကြည့်ပြီး စာလုံးခန့်မှန်းပါ</div>
    <div class="q-text my" id="meaning"></div>
    <div class="len"><span id="len"></span> · Tries left: <b id="tries">6</b></div>
    <div class="hintline" id="hintline" aria-live="polite"></div>
  </div>
  <div class="board" id="board" aria-live="polite"><div class="toast" id="toast" role="status"></div></div>
  <div class="legend">✓ နေရာမှန် · ↔ စာလုံးပါပေမဲ့ နေရာမှား · ✕ မပါဘူး</div>
  <div class="wkb" id="kb"></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="nextrow"><button class="btn primary" id="next" hidden>Next →</button></div>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/fx.js"></script>
<script>
const topic = getTopic();
const LV = getLevel();
renderBar("Word Guess · " + topic.name);
const ROUNDS = 3, TRIES = LV.tries, kbBtns = {}, rank = { x: 1, y: 2, g: 3 };
const wait = ms => new Promise(r => setTimeout(r, ms));
const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let list, i, word, rows, cur, keys, solved, score, done, busy, tiles, results, hinted;

function colorGuess(g, ans) {
  const res = Array(ans.length).fill("x"), left = {};
  [...ans].forEach((c, k) => { if (g[k] === c) res[k] = "g"; else left[c] = (left[c] || 0) + 1; });
  [...g].forEach((c, k) => { if (res[k] !== "g" && left[c] > 0) { res[k] = "y"; left[c]--; } });
  return res;
}

// high-contrast toggle (remembered)
const hcBtn = $("#hc");
function paintHc() { const on = Store.get("hc", false); document.body.classList.toggle("hc", on); hcBtn.setAttribute("aria-pressed", on); }
hcBtn.onclick = () => { Store.set("hc", !Store.get("hc", false)); paintHc(); };
paintHc();

["qwertyuiop", "asdfghjkl", "+zxcvbnm-"].forEach(r => {
  const d = document.createElement("div");
  [...r].forEach(c => {
    const b = document.createElement("button");
    if (c === "+") { b.textContent = "Enter"; b.className = "wide"; b.onclick = submit; }
    else if (c === "-") { b.textContent = "⌫"; b.className = "wide"; b.setAttribute("aria-label", "Delete"); b.onclick = back; }
    else { b.textContent = c; b.onclick = () => type(c); kbBtns[c] = b; }
    d.appendChild(b);
  });
  $("#kb").appendChild(d);
});
$("#kb").addEventListener("mousedown", e => e.preventDefault());   // keep focus off the on-screen keys so Enter submits
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || done || document.querySelector(".overlay")) return;
  if (/^[a-z]$/i.test(e.key)) type(e.key.toLowerCase());
  else if (e.key === "Enter") { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); submit(); }
  else if (e.key === "Backspace") back();
  else return;
  e.preventDefault();
});

function play() {
  list = shuffle(topic.words.filter(w => /^[a-z]+$/i.test(w.en))).slice(0, ROUNDS);
  i = 0; solved = 0; score = 0; results = [];
  load();
}
function paintRounds() {
  $("#rounds").innerHTML = list.map((_, k) => '<span class="rd ' + (results[k] || (k === i ? "cur" : "")) + '"></span>').join("");
}
function load() {
  word = list[i].en.toLowerCase(); rows = []; cur = ""; keys = {}; done = false; busy = false; hinted = false;
  $("#fb").innerHTML = ""; $("#fb").className = "fb"; $("#next").hidden = true;
  $("#meaning").textContent = list[i].my;
  $("#len").textContent = "စာလုံး " + word.length + " လုံး";
  $("#hintline").textContent = "";
  $("#hint").hidden = !LV.hint; $("#hint").disabled = false;
  $("#score").textContent = score;
  $("#tries").textContent = TRIES;
  paintRounds();
  const bd = $("#board"), n = word.length;
  // tile size shrinks on short screens so the keyboard stays in view
  const ts = "clamp(38px, calc((100vh - 470px) / " + TRIES + "), 62px)";
  bd.style.width = "min(100%, calc(" + n + " * " + ts + " + " + (n - 1) * 6 + "px))";
  [...bd.querySelectorAll(".wrow")].forEach(r => r.remove());
  tiles = [];
  for (let r = 0; r < TRIES; r++) {
    const row = document.createElement("div");
    row.className = "wrow"; row.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    const rt = [];
    for (let k = 0; k < n; k++) { const t = document.createElement("div"); t.className = "t"; row.appendChild(t); rt.push(t); }
    bd.appendChild(row); tiles.push(rt);
  }
  for (const c in kbBtns) { kbBtns[c].className = ""; kbBtns[c].disabled = false; }
  $("#kb").querySelectorAll("button").forEach(b => { b.disabled = false; });
  paintCursor();
}
function paintCursor() {
  const r = rows.length;
  tiles.forEach((row, ri) => row.forEach((t, k) => {
    if (ri !== r || done) { t.classList.remove("cur"); return; }
    t.classList.toggle("cur", k === Math.min(cur.length, word.length - 1) && cur.length < word.length);
  }));
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
}
function type(c) {
  if (done || busy || cur.length >= word.length) return;
  const t = tiles[rows.length][cur.length];
  cur += c; t.textContent = c; t.classList.add("typed");
  if (!still()) t.animate([{ transform: "scale(1)" }, { transform: "scale(1.14)" }, { transform: "scale(1)" }], { duration: 110 });
  beep([380 + cur.length * 30], 0.03);
  paintCursor();
}
function back() {
  if (done || busy || !cur) return;
  cur = cur.slice(0, -1);
  const t = tiles[rows.length][cur.length]; t.textContent = ""; t.classList.remove("typed");
  paintCursor();
}
async function submit() {
  if (done || busy) return;
  const r = rows.length, rowEls = tiles[r];
  if (cur.length !== word.length) {
    sfx.bad(); toast("စာလုံး " + word.length + " လုံး ရိုက်ပါ");
    if (!still()) rowEls[0].parentElement.animate([{ transform: "translateX(0)" }, { transform: "translateX(-9px)" }, { transform: "translateX(9px)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 380 });
    return;
  }
  busy = true;
  const guess = cur, res = colorGuess(guess, word);
  rows.push({ text: guess, res }); cur = "";
  $("#tries").textContent = TRIES - rows.length;
  rowEls.forEach(t => t.classList.remove("cur"));
  // reveal: flip tile by tile, colour applied at the half-way point
  for (let k = 0; k < word.length; k++) {
    const t = rowEls[k];
    if (still()) t.classList.add(res[k]);
    else {
      t.animate([{ transform: "rotateX(0)" }, { transform: "rotateX(90deg)" }, { transform: "rotateX(0)" }], { duration: 480, easing: "ease-in-out" });
      setTimeout(() => { t.classList.remove("typed"); t.classList.add(res[k]); beep([res[k] === "g" ? 700 : res[k] === "y" ? 520 : 300], 0.05); }, 240);
      await wait(260);
    }
  }
  if (!still()) await wait(300);
  [...guess].forEach((c, k) => {
    if ((rank[res[k]] || 0) > (rank[keys[c]] || 0)) { keys[c] = res[k]; }
    if (kbBtns[c]) kbBtns[c].className = keys[c];
  });
  busy = false;
  if (guess === word) {
    if (!still()) rowEls.forEach((t, k) => t.animate([{ transform: "translateY(0)" }, { transform: "translateY(-22px)" }, { transform: "translateY(0)" }, { transform: "translateY(-6px)" }, { transform: "translateY(0)" }], { duration: 700, delay: k * 90 }));
    await wait(word.length * 90 + 500);
    finishWord(true);
  } else if (rows.length === TRIES) finishWord(false);
  else { sfx.bad(); paintCursor(); }
}
function hint() {
  if (done || busy || hinted) return;
  hinted = true; $("#hint").disabled = true;
  const known = new Set(); rows.forEach(g => g.res.forEach((s, k) => { if (s === "g") known.add(k); }));
  const open = [...word].map((_, k) => k).filter(k => !known.has(k));
  const k = open.length ? open[Math.floor(Math.random() * open.length)] : 0;
  $("#hintline").textContent = "💡 အက္ခရာ " + (k + 1) + " လုံးမြောက်က “" + word[k].toUpperCase() + "” ပါ";
  sfx.ok();
}
$("#hint").onclick = hint;
function finishWord(win) {
  done = true;
  const w = list[i], fb = $("#fb");
  results[i] = win ? "win" : "lose";
  paintRounds(); paintCursor();
  const info = '<span class="exm">' + w.ex + '</span><span class="exm">' + (w.exMy || "") + "</span>";
  if (win) {
    solved++; const p = Math.max(4, 10 + (TRIES - rows.length) * 2 - (hinted ? 3 : 0)); score += p; addPoints(p); sfx.ok();
    $("#score").textContent = score;
    fb.className = "fb ok"; fb.innerHTML = "✓ <b></b> " + info; $("b", fb).textContent = w.en;
    speak(w.en);
    const r = tiles[rows.length - 1][0]; const pt = fx.at(r.parentElement); fx.confetti(pt.x, pt.y, 40);
    fx.pop(r.parentElement, "+" + p);
  } else {
    sfx.bad();
    fb.className = "fb no"; fb.innerHTML = "စာလုံးက <b></b> ပါ " + info; $("b", fb).textContent = w.en;
    fx.shake($("#board"));
  }
  const n = $("#next");
  n.hidden = false; n.textContent = i === list.length - 1 ? "Finish" : "Next →"; n.focus();
}
$("#next").onclick = () => {
  if (i < list.length - 1) { i++; load(); return; }
  if (solved === ROUNDS) fx.rain(90);
  showResult({
    title: solved === ROUNDS ? "အရမ်းတော်တယ်! 🎉" : "ပြီးပါပြီ!",
    stars: solved === ROUNDS ? 3 : solved >= 2 ? 2 : 1,
    text: solved + " / " + ROUNDS + " လုံး မှန်တယ် · " + score + " points",
    onAgain: play
  });
};
play.gameId = "wordle";
play();
</script>
</body>
</html>
