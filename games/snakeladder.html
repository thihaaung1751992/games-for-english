<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes &amp; Ladders</title>
<link rel="stylesheet" href="css/style.css">
<style>
.sl-board { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); aspect-ratio: 6 / 5; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; margin: 8px 0; background: var(--card); }
.sl-sq { position: relative; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: clamp(1.1rem, 6vw, 1.7rem); min-width: 0; }
.sl-sq:nth-child(odd) { background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
.sl-sq i { position: absolute; top: 1px; left: 3px; font-style: normal; font-size: .62rem; font-weight: 800; color: var(--muted); }
.sl-sq.fin { background: color-mix(in srgb, var(--star) 30%, var(--card)); }
.sl-sq .mk { position: absolute; right: 2px; bottom: 0; font-size: .6rem; font-weight: 800; }
.sl-sq .mk.up { color: var(--good); } .sl-sq .mk.dn { color: var(--bad); }
.sl-sq .tk { z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,.35); line-height: 1; white-space: nowrap; }
.sl-sq.you { box-shadow: inset 0 0 0 3px var(--accent); }
.sl-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.sl-die { display: inline-flex; width: 56px; height: 56px; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; border: 2px solid var(--line); border-radius: 14px; background: var(--card); }
.sl-die.roll { animation: shake .3s infinite; }
.sl-info { text-align: center; min-height: 3.4em; margin: 6px 0; }
@media (prefers-reduced-motion: reduce) { .sl-die.roll { animation: none; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app">
  <div class="stats"><span>🧑 သင်: <b id="pa">0</b></span><span>Turn: <b id="tn">1</b></span><span>🤖 ကွန်ပျူတာ: <b id="pb">0</b></span></div>
  <div class="sl-board" id="board"></div>
  <div class="sl-info" id="msg" aria-live="polite"></div>
  <div class="row" style="align-items:center"><span class="sl-die" id="die" aria-label="Dice">🎲</span><button class="btn primary" id="roll">🎲 Roll</button></div>
  <p class="muted" style="text-align:center">Roll လုပ်ပြီး မေးခွန်းမှန်အောင်ဖြေရင် အကွက်တက်မယ်။ မှားရင် နေရာမရွှေ့ဘူး။ 🪜 တက်ရင် ခုန်တက်၊ 🐍 ကိုက်ရင် ပြန်ချော်ကျမယ်။ ၃၀ ကိုအရင်ရောက်သူ နိုင်မယ်။</p>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script>
const topic = getTopic(), LV = getLevel();
renderBar("Snakes & Ladders · " + topic.name);
const END = 30, COLS = 6, ROWS = 5;
const LADDERS = { 4: 14, 9: 21, 20: 27 };
const SNAKES = { 16: 6, 24: 12, 28: 18 };
const CPU_OK = [0.45, 0.62, 0.72, 0.8][topic.level - 1];   // chance the computer "answers" correctly
const KINDS = [Q.enMy, Q.myEn, Q.blank, Q.sentence];
let bag = [], pos, turn, busy, over, wrongs;

function nextQ() {
  if (!bag.length) bag = shuffle(topic.words);
  return KINDS[Math.floor(Math.random() * KINDS.length)](topic, bag.pop());
}
// square n (1..30) -> grid cell centre in a 600x500 box; row 0 is the bottom and runs left to right, row 1 right to left ...
function cellOf(n) {
  const r = Math.floor((n - 1) / COLS), c0 = (n - 1) % COLS, c = r % 2 ? COLS - 1 - c0 : c0;
  return { r, c, x: c * 100 + 50, y: (ROWS - 1 - r) * 100 + 50 };
}
function build() {
  const b = $("#board"); b.innerHTML = "";
  const order = [];
  for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < COLS; c++) order.push(r % 2 ? r * COLS + (COLS - c) : r * COLS + c + 1);
  order.forEach(n => {
    const d = document.createElement("div");
    d.className = "sl-sq" + (n === END ? " fin" : ""); d.dataset.n = n;
    d.innerHTML = "<i>" + n + "</i>" + (LADDERS[n] ? '<span class="mk up">↗' + LADDERS[n] + "</span>" : "") + (SNAKES[n] ? '<span class="mk dn">↘' + SNAKES[n] + "</span>" : "") + '<span class="tk"></span>';
    if (n === END) d.firstChild.textContent = "🏁 30";
    b.appendChild(d);
  });
  // ladders and snakes as lines
  let s = '<svg class="sl-lines" viewBox="0 0 600 500" preserveAspectRatio="none" aria-hidden="true">';
  Object.entries(LADDERS).forEach(([a, z]) => {
    const p = cellOf(+a), q = cellOf(z), dx = 7;
    s += '<g style="stroke:var(--good);stroke-width:5;stroke-linecap:round;opacity:.8"><line x1="' + (p.x - dx) + '" y1="' + p.y + '" x2="' + (q.x - dx) + '" y2="' + q.y + '"/><line x1="' + (p.x + dx) + '" y1="' + p.y + '" x2="' + (q.x + dx) + '" y2="' + q.y + '"/></g>';
    for (let t = 0.15; t < 0.95; t += 0.14) s += '<line style="stroke:var(--good);stroke-width:4;opacity:.8" x1="' + (p.x - dx + (q.x - p.x) * t) + '" y1="' + (p.y + (q.y - p.y) * t) + '" x2="' + (p.x + dx + (q.x - p.x) * t) + '" y2="' + (p.y + (q.y - p.y) * t) + '"/>';
  });
  Object.entries(SNAKES).forEach(([a, z]) => {
    const p = cellOf(+a), q = cellOf(z), mx = (p.x + q.x) / 2 + (p.x < q.x ? 40 : -40), my = (p.y + q.y) / 2;
    s += '<path d="M' + p.x + " " + p.y + " Q" + mx + " " + my + " " + q.x + " " + q.y + '" style="fill:none;stroke:var(--bad);stroke-width:7;stroke-linecap:round;opacity:.7;stroke-dasharray:14 7"/>';
  });
  b.insertAdjacentHTML("beforeend", s + "</svg>");
}
function paint() {
  $("#pa").textContent = pos[0]; $("#pb").textContent = pos[1]; $("#tn").textContent = turn;
  [...$("#board").querySelectorAll(".sl-sq")].forEach(sq => {
    const n = +sq.dataset.n;
    $(".tk", sq).textContent = (pos[0] === n ? "🧑" : "") + (pos[1] === n ? "🤖" : "");
    sq.classList.toggle("you", pos[0] === n);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function say(t) { $("#msg").textContent = t; }
async function rollDie() {
  const d = $("#die"), faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
  d.classList.add("roll");
  const n = 1 + Math.floor(Math.random() * 6);
  for (let k = 0; k < 6; k++) { d.textContent = faces[Math.floor(Math.random() * 6)]; await wait(80); }
  d.classList.remove("roll"); d.textContent = faces[n - 1];
  return n;
}
// move player p forward n squares one step at a time, then snake / ladder
async function move(p, n) {
  for (let k = 0; k < n && pos[p] < END; k++) { pos[p]++; paint(); await wait(170); }
  if (pos[p] >= END) { pos[p] = END; paint(); return; }
  const to = LADDERS[pos[p]] || SNAKES[pos[p]];
  if (to) {
    const up = !!LADDERS[pos[p]];
    say(up ? "🪜  လှေကားတက်ပြီး " + to + " ကို ခုန်တက်တယ်!" : "🐍  မြွေကိုက်လို့ " + to + " ကို ပြန်ချော်ကျတယ်!");
    up ? sfx.ok() : sfx.bad();
    await wait(600); pos[p] = to; paint(); await wait(400);
  }
}
async function mine() {
  if (busy || over) return;
  busy = true; $("#roll").disabled = true;
  const n = await rollDie();
  const q = nextQ();
  q.label = "🎲 " + n + " ကွက် — " + q.label;
  const ok = await ask(q);
  if (ok) { addPoints(10); say("✓ မှန်တယ်! " + n + " ကွက် တက်မယ်"); await move(0, n); }
  else { wrongs++; say("✗ မှားတယ်၊ နေရာမရွှေ့ဘူး"); await wait(500); }
  if (finished()) return;
  await cpuTurn();
  if (finished()) return;
  turn++; paint(); say("သင့်အလှည့် — Roll နှိပ်ပါ"); busy = false; $("#roll").disabled = false; $("#roll").focus();
}
async function cpuTurn() {
  say("🤖 ကွန်ပျူတာ အလှည့်…");
  await wait(500);
  const n = await rollDie(), ok = Math.random() < CPU_OK;
  if (ok) { say("🤖 မှန်အောင်ဖြေတယ် — " + n + " ကွက်တက်မယ်"); await move(1, n); }
  else { say("🤖 မှားသွားတယ်၊ နေရာမရွှေ့ဘူး"); await wait(800); }
}
function finished() {
  if (pos[0] < END && pos[1] < END) return false;
  over = true;
  const won = pos[0] >= END;
  const close = !won && pos[0] >= 22;
  say(won ? "🏁 သင်နိုင်ပြီ! 🎉" : "🏁 ကွန်ပျူတာ နိုင်သွားတယ်");
  setTimeout(() => showResult({
    title: won ? "နိုင်ပါတယ်! 🎉" : close ? "နည်းနည်းလေး ကွာသွားတယ် 💪" : "ကွန်ပျူတာ နိုင်သွားတယ် 💪",
    stars: won ? 3 : close ? 2 : 1,
    text: "Turn " + turn + " ခုအတွင်း · မှားခဲ့တာ " + wrongs + " ခု",
    onAgain: play
  }), 900);
  return true;
}
function play() {
  pos = [0, 0]; turn = 1; busy = false; over = false; wrongs = 0;
  paint(); say("သင့်အလှည့် — Roll နှိပ်ပါ"); $("#die").textContent = "🎲"; $("#roll").disabled = false;
}
$("#roll").onclick = mine;
build();
play.gameId = "snakeladder";
play();
</script>
</body>
</html>
