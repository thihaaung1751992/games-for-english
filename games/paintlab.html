<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paint Lab</title>
<link rel="stylesheet" href="css/style.css">
<style>
.pl-q { padding: 12px 16px; position: relative; overflow: hidden; }
.pl-q .q-text { margin: 2px 0; }
.pl-my { color: var(--muted); font-weight: 700; min-height: 1.6em; }
.pl-stroke { display: block; width: 100%; max-width: 280px; height: 34px; margin: 2px auto 0; }
.pl-stroke path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pldraw .9s .1s forwards; }
@keyframes pldraw { to { stroke-dashoffset: 0; } }
.pl-lab { position: relative; margin-top: 10px; padding: 14px 8px 12px; border-radius: 22px; border: 2px solid var(--line); overflow: hidden;
  background: radial-gradient(circle at 18% 0, color-mix(in srgb, #ff6b6b 14%, transparent), transparent 45%), radial-gradient(circle at 85% 0, color-mix(in srgb, #4dabf7 16%, transparent), transparent 45%), linear-gradient(var(--card), var(--bg)); }
.pl-shelf { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 6px solid color-mix(in srgb, #b8893d 70%, var(--card)); border-radius: 0 0 6px 6px; }
.pl-pot { --p: #e5383b; position: relative; width: 62px; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: var(--ink); text-align: center; transition: transform .25s cubic-bezier(.3,1.5,.5,1); transform-origin: 50% 90%; }
.pl-pot:hover:not(:disabled) { transform: translateY(-5px); }
.pl-pot:disabled { cursor: default; }
.pl-pot .paint { display: block; height: 20px; margin: 0 2px -10px; border-radius: 50%; background: radial-gradient(ellipse at 35% 30%, color-mix(in srgb, var(--p) 55%, #fff), var(--p) 60%); border: 2px solid rgba(0,0,0,.28); position: relative; z-index: 2; }
.pl-pot .paint::after { content: ""; position: absolute; left: 58%; top: 70%; width: 9px; height: 17px; border-radius: 0 0 8px 8px; background: var(--p); border-right: 2px solid rgba(0,0,0,.18); }
.pl-pot .can { display: block; height: 50px; border-radius: 4px 4px 14px 14px; border: 2px solid #6b7280; position: relative;
  background: linear-gradient(90deg, #8b94a1, #e5e9ef 28%, #c3cad4 60%, #7b8491); box-shadow: 0 4px 5px rgba(0,0,0,.25); }
.pl-pot .can::after { content: ""; position: absolute; left: 0; right: 0; top: 36%; height: 30%; background: var(--p); border-top: 2px solid rgba(0,0,0,.22); border-bottom: 2px solid rgba(0,0,0,.22); }
.pl-pot .nm { display: block; font-size: .78rem; font-weight: 800; margin-top: 4px; line-height: 1.2; }
.pl-pot.tilt { z-index: 5; }
.pl-pot.hint { animation: plhint .9s ease-in-out infinite; }
@keyframes plhint { 50% { transform: translateY(-8px) scale(1.08); filter: drop-shadow(0 0 8px var(--star)); } }
.pl-mix { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin-top: 18px; min-height: 150px; }
.pl-slot { width: 38px; height: 38px; border-radius: 50%; border: 3px dashed var(--line); background: var(--card); transition: background-color .3s, border-color .3s; margin-bottom: 36px; }
.pl-slot.on { border-style: solid; border-color: rgba(0,0,0,.25); }
.pl-bucket { position: relative; width: 150px; height: 124px; margin-top: 26px; }
.pl-handle { position: absolute; left: 50%; top: -26px; width: 116px; height: 56px; margin-left: -58px; border: 5px solid #8a95a3; border-bottom: 0; border-radius: 80px 80px 0 0; }
.pl-bk { position: absolute; inset: 0; border: 4px solid #8a95a3; border-radius: 6px 6px 30px 30px / 6px 6px 22px 22px; overflow: hidden; background: color-mix(in srgb, var(--card) 70%, #cfd8e3); clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%); box-shadow: inset 0 0 14px rgba(0,0,0,.2); }
.pl-liq { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background-color: #ccc; transition: height .55s ease-out, background-color .9s; }
.pl-liq::before { content: ""; position: absolute; left: -5%; right: -5%; top: -9px; height: 18px; border-radius: 50%; background: inherit; filter: brightness(1.15); }
.pl-liq:not(.has)::before { display: none; }
.pl-swirl { position: absolute; inset: -40%; opacity: 0; pointer-events: none; }
.pl-swirl.go { animation: plswirl .85s ease-in-out; }
@keyframes plswirl { 0% { opacity: 0; transform: rotate(0); } 20% { opacity: .95; } 80% { opacity: .95; } 100% { opacity: 0; transform: rotate(540deg); } }
.pl-bk::after { content: ""; position: absolute; top: 6%; left: 12%; width: 9%; height: 70%; border-radius: 10px; background: linear-gradient(rgba(255,255,255,.65), rgba(255,255,255,0)); z-index: 3; }
.pl-bucket.pour .pl-bk { animation: plslosh .5s; }
@keyframes plslosh { 30% { transform: rotate(-3deg); } 70% { transform: rotate(3deg); } }
.pl-tag { text-align: center; min-height: 2.9em; margin-top: 6px; font-weight: 800; line-height: 1.5; }
.pl-tag b { display: inline-block; padding: 1px 14px; border-radius: 99px; border: 2px solid var(--line); background: var(--card); }
.pl-drop { position: fixed; z-index: 40; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; pointer-events: none; }
.pl-blob { display: block; width: 150px; height: 130px; margin: 10px auto 0; filter: drop-shadow(0 6px 5px rgba(0,0,0,.25)); animation: plblob 3s ease-in-out infinite; }
@keyframes plblob { 50% { transform: scale(1.04) rotate(2deg); } }
.pl-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.pl-msg { text-align: center; font-weight: 800; min-height: 3.4em; margin-top: 10px; line-height: 1.6; }
.pl-msg.ok { color: var(--good); } .pl-msg.no { color: var(--bad); }
@media (max-width: 380px) { .pl-pot { width: 56px; } .pl-pot .can { height: 44px; } }
@media (prefers-reduced-motion: reduce) { .pl-stroke path { animation: none; stroke-dashoffset: 0; } .pl-pot.hint, .pl-blob, .pl-bucket.pour .pl-bk, .pl-swirl.go { animation: none; } .pl-pot, .pl-liq { transition: none; } }
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap" id="app"></main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script src="js/fx.js"></script>
<script>
// Mix paint pots to make a colour, or name the colour blob.
const topic = getTopic(), LV = getLevel(), lvl = topic.level;
renderBar("Paint Lab · " + topic.name);
const ROUNDS = 10;
const COL = {
  red: ["#e5383b", "အနီရောင်"], blue: ["#2f6fdc", "အပြာရောင်"], yellow: ["#ffd60a", "အဝါရောင်"], white: ["#fdfdfd", "အဖြူရောင်"], black: ["#1f1f24", "အနက်ရောင်"],
  green: ["#2fb344", "အစိမ်းရောင်"], orange: ["#ff8c1a", "လိမ္မော်ရောင်"], purple: ["#8e44ad", "ခရမ်းရောင်"], pink: ["#ff8fb1", "ပန်းရောင်"],
  gray: ["#9aa0a6", "မီးခိုးရောင်"], brown: ["#8b5a2b", "အညိုရောင်"], "light blue": ["#7ec8f8", "အပြာနုရောင်"]
};
const MIXES = [["red", "yellow", "orange"], ["blue", "yellow", "green"], ["red", "blue", "purple"], ["red", "white", "pink"], ["black", "white", "gray"], ["red", "green", "brown"], ["blue", "white", "light blue"]];
const POTS = ["red", "blue", "yellow", "white", "black", "green"];
const mk = (a, b) => [a, b].sort().join("+");
const MAP = {}; MIXES.forEach(([a, b, r]) => { MAP[mk(a, b)] = r; });
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const avg = (a, b) => "#" + hexRgb(COL[a][0]).map((v, i) => Math.round((v + hexRgb(COL[b][0])[i]) / 2).toString(16).padStart(2, "0")).join("");
const still = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const hint1 = lvl <= 1 ? 1 : 2;     // wrong tries before the right pots glow

$("#app").innerHTML =
  '<div class="stats"><span>Round: <b id="rn">1</b>/' + ROUNDS + '</span><span>Colours: <b id="ok">0</b> 🎨</span><span>Score: <b id="score">0</b></span></div>' +
  '<div class="panel pl-q"><div class="q-label" id="qlabel"></div><div class="q-text" id="qtext"></div><div class="pl-my" id="qmy"></div><div id="stroke"></div>' +
  '<button class="btn" id="say" style="min-height:44px;margin-top:4px">🔊 Listen</button></div>' +
  '<div class="pl-lab" id="lab"></div><div class="pl-msg" id="msg" aria-live="polite"></div>';

let run = 0, plan, round, good, score, kind, tgt, picks, busy, tries, over, qn;
const timers = new Set();
function later(fn, ms) { const id = run; const t = setTimeout(() => { timers.delete(t); if (id === run) fn(); }, ms); timers.add(t); }
function msg(t, c) { const m = $("#msg"); m.textContent = t; m.className = "pl-msg " + (c || ""); }
const strokeSvg = hex => '<svg class="pl-stroke" viewBox="0 0 300 36" aria-hidden="true"><path d="M10 20 C 50 2, 90 36, 150 18 S 250 4, 290 22" fill="none" stroke="' + hex + '" stroke-width="20" stroke-linecap="round" pathLength="1"/>' +
  '<path d="M30 28 C 80 18, 150 34, 270 12" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/></svg>';
const blobSvg = hex => '<svg class="pl-blob" viewBox="0 0 150 130" aria-hidden="true"><path d="M30 25 C 55 -5, 110 0, 128 30 C 150 62, 135 108, 92 120 C 50 132, 12 112, 10 72 C 8 50, 15 40, 30 25 Z" fill="' + hex + '" stroke="rgba(0,0,0,.25)" stroke-width="3"/>' +
  '<ellipse cx="52" cy="38" rx="16" ry="9" fill="rgba(255,255,255,.55)" transform="rotate(-25 52 38)"/></svg>';

function play() {
  run++; timers.forEach(clearTimeout); timers.clear();
  const makes = take(MIXES, 6).map(m => ({ kind: "make", m })), names = take(Object.keys(COL), 4).map(n => ({ kind: "name", n }));
  plan = shuffle(makes.concat(names));
  round = 0; good = 0; score = 0; $("#ok").textContent = 0; $("#score").textContent = 0; next();
}
function next() {
  if (round >= ROUNDS) return end();
  const it = plan[round]; round++; kind = it.kind; busy = false; picks = []; tries = 0; over = false;
  $("#rn").textContent = round; $("#stroke").innerHTML = ""; $("#say").hidden = false;
  const lab = $("#lab"); lab.innerHTML = "";
  if (kind === "make") buildMake(it.m, lab); else buildName(it.n, lab);
}
function buildMake([a, b, r], lab) {
  tgt = { a, b, r };
  $("#qlabel").textContent = "ရောစပ်ပါ · MIX!";
  const qt = $("#qtext"); qt.textContent = "Make " + r; qt.className = "q-text"; qt.style.fontSize = "clamp(1.8rem, 8vw, 2.5rem)";
  $("#qmy").textContent = COL[r][1] + " ပြုလုပ်ပါ";
  if (lvl <= 2) $("#stroke").innerHTML = strokeSvg(COL[r][0]);
  $("#say").onclick = () => speak("Make " + r); speak("Make " + r);
  const set = new Set([a, b]);
  shuffle(POTS.filter(p => !set.has(p))).forEach(p => { if (set.size < 5) set.add(p); });
  lab.innerHTML = '<div class="pl-shelf" id="shelf"></div><div class="pl-mix"><span class="pl-slot" id="s0"></span><div class="pl-bucket" id="bucket"><div class="pl-handle"></div><div class="pl-bk"><div class="pl-liq" id="liq"></div><div class="pl-swirl" id="swirl"></div></div></div><span class="pl-slot" id="s1"></span></div>' +
    '<div class="pl-tag" id="tag"></div><div class="pl-row"><button class="btn" id="empty" style="min-height:46px">🗑️ Empty</button></div>';
  shuffle([...set]).forEach(p => {
    const b = document.createElement("button");
    b.className = "pl-pot"; b.style.setProperty("--p", COL[p][0]); b._p = p; b.setAttribute("aria-label", p);
    b.innerHTML = '<span class="paint"></span><span class="can"></span><span class="nm">' + p + '</span>';
    b.onclick = () => pour(b); $("#shelf").appendChild(b);
  });
  $("#empty").onclick = () => { if (!busy && !over) emptyBucket(); };
  $("#tag").innerHTML = "<span class='muted'>ဆေးအိုး ၂ လုံး ရွေးပါ 👆</span>";
  msg("🎨 ဆေးအိုး ၂ လုံးကို နှိပ်ပြီး ပုံးထဲ လောင်းထည့်ပါ");
}
function emptyBucket() {
  picks = []; $("#liq").style.height = "0"; $("#liq").classList.remove("has"); [0, 1].forEach(i => { const s = $("#s" + i); s.className = "pl-slot"; s.style.backgroundColor = ""; });
  $("#tag").innerHTML = "<span class='muted'>ဆေးအိုး ၂ လုံး ရွေးပါ 👆</span>";
}
function droplets(from, color, n) {
  if (still()) return;
  const b = $("#bucket").getBoundingClientRect(), f = from.getBoundingClientRect();
  const x0 = f.left + f.width / 2, y0 = f.top + 8, x1 = b.left + b.width / 2, y1 = b.top + 30;
  for (let i = 0; i < n; i++) {
    const d = document.createElement("i"); d.className = "pl-drop"; d.style.background = color; d.style.border = "1px solid rgba(0,0,0,.25)";
    d.style.left = "0"; d.style.top = "0"; document.body.appendChild(d);
    const jx = (Math.random() - 0.5) * 30;
    d.animate([{ transform: "translate(" + x0 + "px," + y0 + "px) scale(1)", opacity: 1 },
      { transform: "translate(" + (x0 + (x1 - x0) * 0.5 + jx) + "px," + (Math.min(y0, y1) - 40) + "px) scale(1.2)", opacity: 1, offset: 0.4 },
      { transform: "translate(" + (x1 + jx) + "px," + y1 + "px) scale(.8)", opacity: 1 }], { duration: 520 + i * 25, delay: i * 45, easing: "ease-in", fill: "backwards" }).onfinish = () => d.remove();
  }
  later(() => { const bb = $("#bucket"); if (bb) { const p = fx.at(bb); fx.confetti(p.x, p.y - 20, 14); } }, 500);
}
function pour(b) {
  if (busy || over || picks.length >= 2) return;
  busy = true; const p = b._p, hex = COL[p][0], n = picks.length; picks.push(p);
  sfx.ok(); b.classList.remove("hint");
  if (!still()) { const dir = $("#bucket").getBoundingClientRect().left > b.getBoundingClientRect().left ? 1 : -1; b.style.transform = "translateY(-34px) rotate(" + (dir * 38) + "deg)"; b.classList.add("tilt"); later(() => { b.style.transform = ""; b.classList.remove("tilt"); }, 650); }
  droplets(b, hex, 9);
  const s = $("#s" + n); s.classList.add("on"); s.style.backgroundColor = hex;
  later(() => {
    $("#bucket").classList.add("pour"); later(() => $("#bucket").classList.remove("pour"), 520);
    const liq = $("#liq");
    if (n === 0) { liq.classList.add("has"); liq.style.backgroundColor = hex; liq.style.height = "46%"; $("#tag").innerHTML = "<b>" + p + "</b>"; busy = false; return; }
    const [a, c] = picks, res = a === c ? a : MAP[mk(a, c)], rhex = res ? COL[res][0] : avg(a, c);
    liq.style.height = "82%";
    const sw = $("#swirl"); sw.style.background = "conic-gradient(" + COL[a][0] + "," + COL[c][0] + "," + COL[a][0] + "," + COL[c][0] + "," + COL[a][0] + ")";
    sw.classList.remove("go"); void sw.offsetWidth; sw.classList.add("go");
    later(() => { liq.style.backgroundColor = rhex; }, 380);
    later(() => judge(a, c, res), 1050);
  }, 560);
}
function judge(a, c, res) {
  const t = tgt, ok = res === t.r;
  $("#tag").innerHTML = res ? "<b>" + res + "</b> <span class='muted'>(" + COL[res][1] + ")</span>" : "<b>🤔 ?</b>";
  if (res) speak(res);
  if (ok) {
    over = true; good += tries === 0 ? 1 : 0; const pts = tries === 0 ? 10 : tries === 1 ? 7 : 5; score += pts; addPoints(pts); sfx.ok();
    $("#ok").textContent = good; $("#score").textContent = score;
    $("#stroke").innerHTML = strokeSvg(COL[t.r][0]);
    const p = fx.at($("#bucket")); fx.confetti(p.x, p.y, 44); fx.pop($("#bucket"), "+" + pts);
    msg("✓ " + t.r + " = " + COL[t.r][1] + " 🎉  (" + t.a + " + " + t.b + ")", "ok"); later(next, 2400);
  } else {
    tries++; sfx.bad(); fx.shake($("#bucket"));
    msg(res ? "✗ ဒါက " + res + " (" + COL[res][1] + ") ပါ။ " + t.r + " မဟုတ်သေးဘူး၊ Empty လုပ်ပြီး ထပ်ကြိုးစားပါ" : "✗ ဒီအရောင်နှစ်ခု ရောရင် " + t.r + " မထွက်ဘူး၊ ထပ်ကြိုးစားပါ", "no");
    busy = true;
    later(() => { emptyBucket(); busy = false; if (tries >= hint1) { $$pots().forEach(b => { if (b._p === t.a || b._p === t.b) b.classList.add("hint"); }); msg("💡 အလင်းပေးထားတဲ့ ဆေးအိုးနှစ်လုံးကို ရွေးကြည့်ပါ"); } }, 1700);
  }
}
const $$pots = () => [...document.querySelectorAll(".pl-pot")];
function buildName(n, lab) {
  const hex = COL[n][0];
  tgt = { n };
  $("#qlabel").textContent = "ဒီအရောင်ကို English နဲ့ ဘယ်လိုခေါ်လဲ?";
  const qt = $("#qtext"); qt.textContent = "What colour is this?"; qt.className = "q-text"; qt.style.fontSize = "clamp(1.4rem, 6vw, 1.9rem)";
  $("#qmy").textContent = ""; $("#say").hidden = true;
  const names = shuffle(Object.keys(COL).filter(x => x !== n)).slice(0, LV.opts - 1);
  lab.innerHTML = blobSvg(hex) + '<div class="opts" id="co" style="padding:0 10px"></div>';
  shuffle([n, ...names]).forEach(x => {
    const b = document.createElement("button"); b.className = "opt"; b.textContent = x; b.onclick = () => choose(b, x); $("#co").appendChild(b);
  });
  msg("🎨 အရောင်ရဲ့ English နာမည်ကို ရွေးပါ");
}
function choose(b, x) {
  if (over) return; over = true;
  const n = tgt.n, ok = x === n;
  [...$("#co").children].forEach(o => { o.disabled = true; if (o.textContent === n) o.classList.add("right"); });
  speak(n);
  if (ok) {
    good++; score += 10; addPoints(10); sfx.ok(); $("#ok").textContent = good; $("#score").textContent = score;
    const p = fx.at(b); fx.confetti(p.x, p.y, 36); fx.pop(b, "+10");
    msg("✓ " + n + " = " + COL[n][1], "ok"); later(next, 1900);
  } else {
    sfx.bad(); b.classList.add("wrong"); msg("✗ ဒါက " + n + " (" + COL[n][1] + ") ပါ", "no"); later(next, 2900);
  }
}
function end() {
  const r = good / ROUNDS; fx.rain(50);
  showResult({ title: cheer(r), stars: starsFor(r), text: good + " / " + ROUNDS + " ခု တစ်ခါတည်း မှန်တယ် · " + score + " points", onAgain: play });
}
play.gameId = "paintlab";
play();
</script>
</body>
</html>
