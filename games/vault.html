<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault Cracker</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root { --bg: #0a0f1c; --card: #151c2e; --ink: #f1f5ff; --muted: #9aa7c2; --line: #2a3550; --accent: #f59e0b; --good: #4ade80; --bad: #fb7185; --warn: #f59e0b; --star: #fbbf24; }
[hidden] { display: none !important; }
body { background: radial-gradient(700px 420px at 50% 115%, rgba(245,158,11,.2), transparent 65%), var(--bg); background-attachment: fixed; overflow-x: hidden; }
body::before {
  content: ""; position: fixed; left: 50%; top: -10vh; width: 180vmax; height: 180vmax; margin-left: -90vmax; z-index: -1; pointer-events: none; transform-origin: 50% 0;
  background: conic-gradient(from 150deg at 50% 0, transparent 0deg, rgba(250,204,21,.11) 14deg, transparent 28deg, transparent 34deg, rgba(56,189,248,.09) 48deg, transparent 62deg);
  animation: vtbeam 9s ease-in-out infinite alternate;
}
@keyframes vtbeam { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
.wrap { max-width: 520px; }
.btn.primary { color: #1a1204; }
.vt-hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 10px; }
.vt-dots { display: flex; gap: 6px; }
.vt-dots i { width: 12px; height: 12px; border-radius: 3px; background: var(--line); transform: rotate(45deg); }
.vt-dots i.cur { background: var(--star); box-shadow: 0 0 8px var(--star); animation: vtbeat 1.2s infinite; }
.vt-dots i.ok { background: var(--good); } .vt-dots i.no { background: var(--bad); }
@keyframes vtbeat { 50% { transform: rotate(45deg) scale(1.35); } }
.vt-alarm { display: flex; align-items: center; gap: 5px; font: 800 .68rem ui-monospace, Menlo, monospace; letter-spacing: .12em; color: var(--muted); }
.vt-alarm i { width: 13px; height: 13px; border-radius: 50%; background: #3a1620; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); }
.vt-alarm i.on { background: #ff3b5c; box-shadow: 0 0 10px #ff3b5c, 0 0 2px #fff inset; animation: vtsiren .5s 3; }
@keyframes vtsiren { 50% { opacity: .3; } }
.vt-score { font-weight: 800; }

/* the secret note */
.vt-note {
  position: relative; margin: 0 6px 14px; padding: 12px 14px 12px; border-radius: 4px 14px 6px 12px; text-align: center; color: #2a1b06; transform: rotate(-.8deg);
  background: linear-gradient(175deg, #fff8dc, #fde9a8); box-shadow: 0 10px 22px rgba(0,0,0,.5), inset 0 -18px 24px rgba(180,120,20,.12);
}
.vt-note::before { content: "📎"; position: absolute; left: 10px; top: -14px; font-size: 1.5rem; transform: rotate(-18deg); }
.vt-note::after { content: "TOP SECRET"; position: absolute; right: 10px; top: 8px; font: 800 .6rem ui-monospace, Menlo, monospace; letter-spacing: .12em; color: #be123c; border: 2px solid #be123c; border-radius: 4px; padding: 0 5px; transform: rotate(8deg); opacity: .75; }
.vt-lab { font-size: .72rem; font-weight: 800; letter-spacing: .06em; color: #92400e; }
.vt-my { font-weight: 800; font-size: clamp(1.4rem, 6.4vw, 1.9rem); line-height: 1.55; margin: 2px 0; }
.vt-ctx { font-size: .92rem; line-height: 1.55; font-style: italic; }
.vt-ctx span { display: block; font-style: normal; font-size: .8rem; color: #7a5b25; }
.vt-btns { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
.vt-chip { font: inherit; font-size: .85rem; font-weight: 800; min-height: 44px; padding: 0 14px; border-radius: 99px; border: 2px solid #92400e; background: rgba(146,64,14,.08); color: #2a1b06; cursor: pointer; }
.vt-chip:disabled { opacity: .4; cursor: default; }

/* the vault */
.vt-safe {
  position: relative; border-radius: 24px; padding: 10px; perspective: 900px;
  background: linear-gradient(#444d5e, #1b202a); box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -4px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.6); transition: box-shadow .3s;
}
.vt-inside { position: absolute; inset: 10px; padding-left: 27%; border-radius: 16px; overflow: hidden;   /* the open door covers the left quarter */ display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at 50% 62%, #8a5a00, #241500 72%); box-shadow: inset 0 0 40px #000; }
.vt-rays { position: absolute; left: 50%; top: 58%; width: 150%; aspect-ratio: 1; margin: -75% 0 0 -75%; background: repeating-conic-gradient(rgba(255,214,102,.2) 0 10deg, transparent 10deg 20deg); animation: vtrays 16s linear infinite; }
@keyframes vtrays { to { transform: rotate(360deg); } }
.vt-gold { position: relative; font-size: 2.4rem; line-height: 1.2; letter-spacing: 4px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
.vt-word { position: relative; font-weight: 900; font-size: clamp(1.7rem, 8vw, 2.5rem); letter-spacing: .08em; text-transform: uppercase; line-height: 1.3; color: #ffe38a; text-shadow: 0 2px 0 #7a4b00, 0 0 22px rgba(255,214,102,.8); }
.vt-mean { position: relative; font-weight: 700; color: #fff3cf; }
.vt-door {
  position: relative; border-radius: 16px; padding: 22px 12px 10px; transform-origin: left center; transition: transform .95s cubic-bezier(.5,0,.2,1), filter .95s;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 3px), linear-gradient(135deg, #b4bfce 0%, #6c7788 38%, #97a3b5 60%, #4d5766 100%);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), inset 0 0 0 7px rgba(0,0,0,.16), inset 0 -12px 22px rgba(0,0,0,.3);
}
.vt-safe.open .vt-door { transform: rotateY(80deg); filter: brightness(.5); pointer-events: none; }   /* swings into the vault, so it stays inside the frame */
.vt-door > i { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f8fafc, #64748b 60%, #1f2937); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
.vt-door > i:nth-child(1) { left: 9px; top: 9px; } .vt-door > i:nth-child(2) { right: 9px; top: 9px; }
.vt-door > i:nth-child(3) { left: 9px; bottom: 9px; } .vt-door > i:nth-child(4) { right: 9px; bottom: 9px; }
.vt-panel { border-radius: 14px; padding: 10px 8px 8px; background: #0b1017; box-shadow: inset 0 3px 12px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.4); }
.vt-reels { display: flex; gap: 4px; justify-content: center; --fs: min(1.55rem, calc((min(100vw, 520px) - 84px) / var(--n, 6) * .62)); }
.vt-col { flex: 1 1 0; min-width: 0; max-width: 46px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.vt-reel {
  position: relative; width: 100%; height: 108px; padding: 0; border: 0; border-radius: 8px; overflow: hidden; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none;
  background: linear-gradient(90deg, #cfc7b0, #fffaf0 28%, #fffaf0 72%, #c6bda4); color: #1b1f2a; box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
  font: 900 var(--fs)/36px ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-transform: uppercase;
}
.vt-reel::before, .vt-reel::after { position: absolute; left: 0; right: 0; z-index: 3; font-size: .5rem; line-height: 1; color: rgba(255,255,255,.8); pointer-events: none; }
.vt-reel::before { content: "▲"; top: 4px; } .vt-reel::after { content: "▼"; bottom: 4px; }
.vt-strip { display: flex; flex-direction: column; transition: transform .22s cubic-bezier(.3,1.4,.5,1); }
.vt-strip span { height: 36px; flex: none; display: flex; align-items: center; justify-content: center; }
.vt-shade { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.18) 30%, transparent 40%, transparent 60%, rgba(0,0,0,.18) 70%, rgba(0,0,0,.82)); }
.vt-shade::before { content: ""; position: absolute; left: 0; right: 0; top: 35px; height: 38px; border-top: 2px solid #e11d48; border-bottom: 2px solid #e11d48; }
.vt-reel.lock { cursor: default; background: linear-gradient(90deg, #d97706, #fde68a 30%, #fde68a 70%, #b45309); }
.vt-reel.lock::before, .vt-reel.lock::after { content: ""; }
.vt-reel.lock .vt-shade::before { border-color: #16a34a; }
.vt-reel.reveal { color: #be123c; cursor: default; }
.vt-reel.reveal::before, .vt-reel.reveal::after { content: ""; }
.vt-led { width: 9px; height: 9px; border-radius: 50%; background: #2b3340; box-shadow: inset 0 1px 2px #000; transition: background .2s, box-shadow .2s; }
.vt-led.g { background: #4ade80; box-shadow: 0 0 9px #4ade80; } .vt-led.r { background: #fb7185; box-shadow: 0 0 9px #fb7185; }
.vt-wheel { display: block; margin: 10px auto 0; padding: 0; border: 0; background: none; color: #0b1017; font: inherit; cursor: pointer; text-align: center; border-radius: 20px; }
.vt-wheel svg { display: block; width: 100px; height: 100px; margin: 0 auto; filter: drop-shadow(0 5px 5px rgba(0,0,0,.55)); transition: transform .15s; }
.vt-wheel:active svg { transform: rotate(18deg); }
.vt-wheel.spin svg { animation: vtspin .6s cubic-bezier(.4,0,.2,1); }
@keyframes vtspin { to { transform: rotate(360deg); } }
.vt-cap { display: inline-block; margin-top: 2px; padding: 0 12px; border-radius: 99px; background: #0b1017; color: #fde68a; font: 800 .78rem/1.9 ui-monospace, Menlo, monospace; letter-spacing: .12em; }
.vt-safe.buzz { box-shadow: 0 0 0 3px #ff3b5c, 0 0 34px rgba(255,59,92,.75), 0 18px 40px rgba(0,0,0,.6); }
.vt-safe.alarm { animation: vtalarm .5s 5; box-shadow: 0 0 0 3px #ff3b5c, 0 0 26px rgba(255,59,92,.55), 0 18px 40px rgba(0,0,0,.6); }
@keyframes vtalarm { 50% { box-shadow: 0 0 0 3px #ff3b5c, 0 0 60px rgba(255,59,92,.95), 0 18px 40px rgba(0,0,0,.6); } }
.vt-fb { min-height: 3.4em; text-align: center; margin: 12px 4px 4px; font-size: .95rem; line-height: 1.7; color: var(--muted); }
.vt-fb.no { color: var(--bad); font-weight: 700; }
.vt-next { text-align: center; }
@media (prefers-reduced-motion: reduce) {
  body::before, .vt-dots i.cur, .vt-alarm i.on, .vt-rays, .vt-wheel.spin svg, .vt-safe.alarm { animation: none; }
  .vt-door, .vt-strip { transition: none; }
}
</style>
</head>
<body>
<header id="bar" class="bar"></header>
<main class="wrap">
  <div class="vt-hud">
    <div class="vt-dots" id="dots" aria-label="Vaults"></div>
    <div class="vt-alarm" id="alarm" aria-live="polite"></div>
    <span class="vt-score">💰 <span id="score">0</span></span>
  </div>
  <div class="vt-note">
    <div class="vt-lab">လျှို့ဝှက်စာလုံးရဲ့ အဓိပ္ပါယ်</div>
    <div class="vt-my my" id="meaning"></div>
    <div class="vt-ctx" id="ctx"></div>
    <div class="vt-btns">
      <button class="vt-chip" id="say" type="button">🔊 Listen</button>
      <button class="vt-chip" id="hint" type="button">💡 Hint −3</button>
    </div>
  </div>
  <div class="vt-safe" id="safe">
    <div class="vt-inside" aria-hidden="true">
      <div class="vt-rays"></div>
      <div class="vt-gold">🪙💰💎</div>
      <div class="vt-word" id="inword"></div>
      <div class="vt-mean my" id="inmean"></div>
    </div>
    <div class="vt-door" id="door">
      <i></i><i></i><i></i><i></i>
      <div class="vt-panel"><div class="vt-reels" id="reels"></div></div>
      <button class="vt-wheel" id="open" type="button" aria-label="Open the vault">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="38" fill="none" stroke="#1f2937" stroke-width="11"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="#e5e7eb" stroke-width="7"/>
          <g stroke="#cbd5e1" stroke-width="7" stroke-linecap="round">
            <line x1="50" y1="50" x2="50" y2="14"/><line x1="50" y1="50" x2="50" y2="14" transform="rotate(72 50 50)"/>
            <line x1="50" y1="50" x2="50" y2="14" transform="rotate(144 50 50)"/><line x1="50" y1="50" x2="50" y2="14" transform="rotate(216 50 50)"/>
            <line x1="50" y1="50" x2="50" y2="14" transform="rotate(288 50 50)"/>
          </g>
          <circle cx="50" cy="50" r="15" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
          <circle cx="45" cy="45" r="4" fill="#fff7d6" opacity=".8"/>
        </svg>
        <span class="vt-cap">OPEN · ဖွင့်မယ်</span>
      </button>
    </div>
  </div>
  <div class="vt-fb" id="fb" aria-live="polite"></div>
  <div class="vt-next"><button class="btn primary" id="next" hidden>Next →</button></div>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/choice.js"></script>
<script src="js/kit.js"></script>
<script src="js/fx.js"></script>
<script src="js/learn.js"></script>
<script>
// Crack the vault by spelling the secret word on its letter wheels. Every wheel holds the right letter and a few
// look-alikes: tap (or swipe) to turn it, then spin the handle. Green lamps mark the wheels that are right.
// Three wrong tries set off the alarm.
const topic = getTopic(), LV = getLevel(), lvl = topic.level;
renderBar("Vault Cracker · " + topic.name);
const POOL = [...new Map(topic.words.map(w => [w.en, w])).values()];
const ROUNDS = Math.min(6, POOL.length), TRIES = 3, CELL = 36;
const K = [0, 3, 4, 5, 6][lvl] || 4;                    // letters on each wheel
const GIVEN = [0, 0.4, 0.25, 0.12, 0][lvl] || 0;        // share of wheels that start solved
const SIM = { a: "eou", e: "iau", i: "eyu", o: "uae", u: "oae", y: "ie", b: "pd", c: "ks", d: "tb", f: "vp", g: "jk", h: "nw", j: "gz", k: "cg", l: "r", m: "n", n: "m", p: "bf", q: "k", r: "l", s: "cz", t: "d", v: "fw", w: "v", x: "s", z: "s" };
const safe = $("#safe");
const still = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let list, i, reels, tries, done, busy, hinted, cracked, score, items, marks, runId = 0;

function later(fn, ms) { const id = runId; setTimeout(() => { if (id === runId) fn(); }, ms); }
function fb(t, cls) { const m = $("#fb"); m.textContent = t; m.className = "vt-fb " + (cls || ""); }
function fbCard(w, ok) { const m = $("#fb"); m.className = "vt-fb"; m.innerHTML = ""; m.appendChild(wordCard(w, ok)); }
// The right letter plus look-alike / sound-alike letters, shuffled.
function wheelLetters(c) {
  const rest = shuffle([...("aeiouy".includes(c) ? "aeiouy" : "bcdfghklmnprstvw")]);
  const pool = [...new Set([...(SIM[c] || ""), ...rest])].filter(x => x !== c);
  return shuffle([c, ...pool.slice(0, K - 1)]);
}
function paint() {
  $("#score").textContent = score;
  $("#dots").innerHTML = list.map((_, k) => '<i class="' + (marks[k] || (k === i ? "cur" : "")) + '"></i>').join("");
  $("#alarm").innerHTML = "ALARM " + Array.from({ length: TRIES }, (_, k) => '<i class="' + (k < TRIES - tries ? "on" : "") + '"></i>').join("");
  $("#alarm").setAttribute("aria-label", "Tries left: " + tries);
}
function draw(r) {
  r.strip.style.transform = "translateY(" + ((1 - r.idx) * CELL) + "px)";
  r.btn.classList.toggle("lock", r.lock);
  r.btn.setAttribute("aria-valuetext", r.letters[r.idx].toUpperCase() + (r.lock ? " (locked)" : ""));
}
function step(r, d) {
  if (done || busy || r.lock) return;
  r.idx = (r.idx + d + r.letters.length) % r.letters.length;
  r.led.className = "vt-led";
  draw(r); beep([d > 0 ? 1250 : 1050], 0.03);
}
function buildReels(en) {
  const box = $("#reels");
  box.innerHTML = ""; box.style.setProperty("--n", en.length);
  const open = [...en].map((c, k) => k).filter(k => /[a-z]/.test(en[k]));
  const given = new Set(shuffle(open).slice(0, Math.floor(open.length * GIVEN)));
  reels = [...en].map((c, k) => {
    const fixed = !/[a-z]/.test(c), letters = fixed ? [c] : wheelLetters(c);
    const col = document.createElement("div"); col.className = "vt-col";
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "vt-reel";
    btn.setAttribute("role", "spinbutton"); btn.setAttribute("aria-label", "Letter " + (k + 1));
    const strip = document.createElement("div"); strip.className = "vt-strip";
    letters.forEach(l => { const s = document.createElement("span"); s.textContent = l; strip.appendChild(s); });
    const shade = document.createElement("span"); shade.className = "vt-shade";
    const led = document.createElement("i"); led.className = "vt-led" + (fixed || given.has(k) ? " g" : "");
    btn.append(strip, shade); col.append(btn, led); box.appendChild(col);
    const r = { c, letters, fixed, lock: fixed || given.has(k), idx: letters.indexOf(c), btn, strip, led };
    if (!r.lock) r.idx = (r.idx + 1 + Math.floor(Math.random() * (letters.length - 1))) % letters.length;   // always starts wrong
    // tap the lower part (or swipe up) for the next letter, the top part (or swipe down) for the one before
    let y0 = null, swiped = false;
    btn.addEventListener("pointerdown", e => { y0 = e.clientY; swiped = false; });
    btn.addEventListener("pointerup", e => { if (y0 != null && Math.abs(e.clientY - y0) > 16) { swiped = true; step(r, e.clientY < y0 ? 1 : -1); } y0 = null; });
    btn.addEventListener("pointercancel", () => { y0 = null; });
    btn.onclick = e => {
      if (swiped) { swiped = false; return; }
      const b = btn.getBoundingClientRect();
      step(r, e.clientY && e.clientY - b.top < b.height * 0.38 ? -1 : 1);
    };
    btn.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); step(r, 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); step(r, -1); }
      else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = reels[k + (e.key === "ArrowRight" ? 1 : -1)]; if (n) n.btn.focus(); }
    });
    // the wheels roll into place one after another
    strip.style.transition = "none"; strip.style.transform = "translateY(" + ((1 - (letters.length - 1)) * CELL - CELL) + "px)";
    void strip.offsetWidth; strip.style.transition = ""; strip.style.transitionDelay = (k * 45) + "ms";
    draw(r);
    return r;
  });
  later(() => reels.forEach(r => { r.strip.style.transitionDelay = ""; }), 700);
}

function play() {
  runId++;
  list = shuffle(POOL).slice(0, ROUNDS); i = 0; cracked = 0; score = 0; items = []; marks = [];
  load();
}
function load() {
  const w = list[i];
  tries = TRIES; done = false; busy = false; hinted = false;
  safe.className = "vt-safe";
  $("#meaning").textContent = w.my;
  const ctx = $("#ctx"); ctx.textContent = "“" + blankOut(w) + "”";
  const cm = document.createElement("span"); cm.className = "my"; cm.textContent = w.exMy || ""; ctx.appendChild(cm);
  $("#say").onclick = () => speak(w.en);
  $("#hint").hidden = !LV.hint; $("#hint").disabled = false;
  $("#next").hidden = true;
  buildReels(w.en.toLowerCase());
  fb("ဘီးတွေကို နှိပ်ပြီး (သို့) အပေါ်အောက် ပွတ်ဆွဲပြီး စာလုံးပေါင်းပါ — ပြီးရင် လက်ကိုင်ဘီးကို လှည့်ပါ");
  paint();
}
function tryOpen() {
  if (done || busy) return;
  busy = true;
  const wheel = $("#open");
  wheel.classList.remove("spin"); void wheel.offsetWidth; wheel.classList.add("spin");
  beep([320, 260], 0.08);
  later(() => {
    const open = reels.filter(r => !r.fixed);
    let right = 0;
    open.forEach(r => {
      const ok = r.letters[r.idx] === r.c;
      r.led.className = "vt-led " + (ok ? "g" : "r");
      if (ok) { right++; r.lock = true; draw(r); }
    });
    if (right === open.length) return crack();
    tries--; paint(); sfx.bad(); fx.shake(safe);
    if (tries <= 0) return fail();
    safe.classList.add("buzz"); later(() => safe.classList.remove("buzz"), 600);
    fb("🚨 " + right + " / " + open.length + " လုံး မှန်တယ် — အစိမ်းမီးလင်းတဲ့ ဘီးတွေ မှန်ပြီ၊ အနီတွေကို ပြင်ပါ" + (tries === 1 ? " (နောက်ဆုံး အခွင့်အရေး!)" : ""), "no");
    busy = false;
  }, 560);
}
function showNext() { const n = $("#next"); n.hidden = false; n.textContent = i === ROUNDS - 1 ? "Finish" : "Next vault →"; n.focus({ preventScroll: true });
  later(() => n.scrollIntoView({ block: "nearest", behavior: still() ? "auto" : "smooth" }), 1000);   // after the door has swung open
}
function crack() {
  const w = list[i], pts = Math.max(5, 10 + (tries - 1) * 5 - (hinted ? 3 : 0));
  done = true; cracked++; score += pts; addPoints(pts);
  items.push({ w, ok: true }); marks[i] = "ok";
  sfx.ok(); paint();
  $("#inword").textContent = w.en; $("#inmean").textContent = w.my;
  $("#hint").disabled = true;
  later(() => {
    safe.classList.add("open"); speak(w.en);
    const c = fx.at(safe); fx.confetti(c.x, c.y, 46); fx.pop(safe, "+" + pts);
  }, 300);
  fbCard(w, true); showNext();
}
function fail() {
  const w = list[i];
  done = true; items.push({ w, ok: false }); marks[i] = "no";
  safe.classList.add("alarm"); paint();
  reels.forEach(r => { if (!r.lock) { r.idx = r.letters.indexOf(r.c); r.btn.classList.add("reveal"); draw(r); } });   // `done` keeps them from turning
  $("#hint").disabled = true;
  later(() => speak(w.en), 400);
  fbCard(w, false); showNext();
}
$("#open").onclick = tryOpen;
$("#hint").onclick = () => {
  if (done || busy || hinted) return;
  const open = reels.filter(r => !r.lock);
  if (open.length < 2) { fb("Hint မလိုတော့ဘူး — တစ်လုံးပဲ ကျန်တော့တယ်!"); return; }
  hinted = true; $("#hint").disabled = true;
  const r = open[Math.floor(Math.random() * open.length)];
  r.idx = r.letters.indexOf(r.c); r.lock = true; r.led.className = "vt-led g"; draw(r);
  sfx.ok(); fb("💡 ဘီးတစ်ခုကို ဖွင့်ပေးလိုက်ပြီ (−3 points)");
};
$("#next").onclick = () => {
  if (i < ROUNDS - 1) { i++; load(); return; }
  const r = cracked / ROUNDS;
  $("#next").hidden = true;
  showRecap({ items, onClose: () => {
    if (r >= 0.9) fx.rain(90);
    showResult({ title: cheer(r), stars: starsFor(r), text: "ရွှေသေတ္တာ " + cracked + " / " + ROUNDS + " လုံး ဖွင့်နိုင်တယ် · " + score + " points", onAgain: play });
  } });
};
play.gameId = "vault";
play();
</script>
